services:
  gateway:
    environment:
      - GATEWAY_SELF_ORIGIN=${GATEWAY_SELF_ORIGIN:-}
      - LOBES_MESH_KEY=${LOBES_MESH_KEY:-}
      - LOBES_MESH_NAME=${LOBES_MESH_NAME:-}
      - LOBES_MESH_SEEDS=${LOBES_MESH_SEEDS:-}
      - LOBES_MESH_HEARTBEAT_S=${LOBES_MESH_HEARTBEAT_S:-60}
      - LOBES_MESH_MISSED_MAX=${LOBES_MESH_MISSED_MAX:-3}
      - LOBES_MESH_LEDGER_PATH=${LOBES_MESH_LEDGER_PATH:-/home/gateway/mesh/ledger.json}
      - DECIDER_FEASIBLE=${DECIDER_FEASIBLE:-}
      # ── lane safety (#304/#307/#308, R1 0.89.0) — #310 t7, 2026-10-17 ──
      - MG_LOG_DIR=/logs/model-gear
      - MG_LOG_NAME=gateway
      - LOBES_BOOT_DELAY_S=${LOBES_BOOT_DELAY_S:-120}
      - LOBES_BOOT_ORDER=${LOBES_BOOT_ORDER:-}
      - LOBES_BOOT_STAGGER_S=${LOBES_BOOT_STAGGER_S:-20}
      - LOBES_THERMAL_ZONES=${LOBES_THERMAL_ZONES:-}
      - LOBES_THERMAL_SHED_C=${LOBES_THERMAL_SHED_C:-}
      - LOBES_THERMAL_RESUME_C=${LOBES_THERMAL_RESUME_C:-}
    image: lobes-gateway:worker
    volumes:
      - ${LOBES_MESH_DIR:-./mesh}:/home/gateway/mesh
      - ${MODEL_GEAR_LOG_DIR:-./logs}:/logs/model-gear
      - ./mg-logwrap.sh:/usr/local/bin/mg-logwrap:ro
    # gateway under the wrapper (boot hold); image ENTRYPOINT is python -m lobes.gateway, no CMD
    entrypoint: ["bash", "/usr/local/bin/mg-logwrap"]
    command: ["python", "-m", "lobes.gateway"]
    healthcheck:
      start_period: 200s

  # ── vllm-worker on official vLLM v0.31.0 with persistent caches (2026-10-17) ──
  # Cold caches crash 3 of 4 boots on Thor (FlashInfer fp8_gemm_cutlass JIT, then
  # an illegal access in the GDN prefill warmup); warm caches 0 of 3, about 200 s
  # to ready. See agentculture/lobes-cli#309. Caches pre-seeded from that repro
  # (same argv and image). Before any restart: sync; echo 3 > /proc/sys/vm/drop_caches.
  # Rollback: restore docker-compose.override.yml.bak-20261017-094330-pre-v031-worker.
  vllm-worker:
    # image line retired 2026-10-17 (#310 t8): the image now comes from VLLM_NIGHTLY_IMAGE in .env
    # #310 deviation d1 (2026-10-17): test --mm-encoder-attn-backend=TORCH_SDPA for the 0.31.0 / sm_110
    # vision regression (FLASH_ATTN ViT misreads images). Base command respelled verbatim + ONE flag.
    # Rollback: restore docker-compose.override.yml.bak-*-d1 and recreate the worker.
    command: >-
      vllm serve ${WORKER_MODEL:-nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4}
      --served-model-name=${WORKER_SERVED_NAME:-nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4}
      --host=0.0.0.0
      --port=8000
      --quantization=${WORKER_QUANTIZATION:-modelopt}
      --max-model-len=${WORKER_MAX_MODEL_LEN:-65536}
      --gpu-memory-utilization=${WORKER_GPU_MEM_UTIL:-0.30}
      ${WORKER_KV_CACHE_DTYPE:+--kv-cache-dtype=${WORKER_KV_CACHE_DTYPE}}
      ${WORKER_MAX_NUM_SEQS:+--max-num-seqs=${WORKER_MAX_NUM_SEQS}}
      ${WORKER_SPECULATIVE_CONFIG-}
      --enable-auto-tool-choice
      --tool-call-parser=qwen3_coder
      --reasoning-parser=${WORKER_REASONING_PARSER:-nemotron_v3}
      --trust-remote-code
      --mm-encoder-attn-backend=TORCH_SDPA
    volumes:
      - ${HOME}/.lobes/cache/worker/vllm:/root/.cache/vllm
      - ${HOME}/.lobes/cache/worker/flashinfer:/root/.cache/flashinfer

  # ── lane safety (#304/#307/#308, R1 0.89.0) — #310 t7, 2026-10-17 ──
  # Per-lane compile + FlashInfer caches (lines from `lobes doctor`, compile_cache_unmounted)
  # and the longer start_period the boot hold must fit inside. Only the lanes this box hosts.
  # vllm-worker keeps its own hand-mounted warm caches above (cold caches crash on Thor, #309).
  vllm-embed:
    environment:
      - VLLM_CACHE_ROOT=${LOBES_VLLM_CACHE_ROOT:-/cache/vllm}
      - FLASHINFER_WORKSPACE_BASE=${LOBES_FLASHINFER_WORKSPACE_BASE:-/cache/flashinfer}
    volumes:
      - ${LOBES_COMPILE_CACHE_DIR:-./compile-cache}/embed:/cache/vllm
      - ${LOBES_COMPILE_CACHE_DIR:-./compile-cache}/embed-flashinfer:/cache/flashinfer
    healthcheck:
      start_period: 780s
  vllm-rerank:
    environment:
      - VLLM_CACHE_ROOT=${LOBES_VLLM_CACHE_ROOT:-/cache/vllm}
      - FLASHINFER_WORKSPACE_BASE=${LOBES_FLASHINFER_WORKSPACE_BASE:-/cache/flashinfer}
    volumes:
      - ${LOBES_COMPILE_CACHE_DIR:-./compile-cache}/rerank:/cache/vllm
      - ${LOBES_COMPILE_CACHE_DIR:-./compile-cache}/rerank-flashinfer:/cache/flashinfer
    healthcheck:
      start_period: 780s
