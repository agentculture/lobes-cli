# lobes deployment-SHAPE override — GENERATED by `lobes init --shape <mesh-shape> --apply`.
#
# brain-shapes t4b (issue #113). A docker-compose *override* layered LAST via
#   docker compose -f docker-compose.yml [-f docker-compose.audio.yml] \
#                   -f docker-compose.shape.yml up -d
# (`lobes fleet up --apply` auto-includes it when present). It parks each core
# service this shape DROPS in the `shape-dropped` compose profile — a profile
# NOTHING activates, so `docker compose up` skips the service. Without it the
# base compose boots every core gear unconditionally, so a dropped lobe would
# RUN and eat the GPU budget the shape reclaimed (proven live on the GB10).
#
# The gateway needs no patch here. It used to be reset with the compose
# `!reset` merge tag, because the base template made every core service a
# hard start-order dependency of the gateway and a profile-disabled service
# left that edge dangling. Since issue #222 the base template declares no
# such dependency at all — an unconditional one meant ANY gateway restart
# started every heavy lane, including one this box declares infeasible — so
# there is nothing left here to reset.
#
# This file is also where the deployment's OWN opt-in compose edits are
# rendered — today exactly one, the INNEREYE_UI_PORT publication of
# ComfyUI's web UI (see the block below when present). Compose cannot
# conditionally omit a key, so an opt-in host-port publication can only
# come from a generated override like this one. The two kinds of block are NOT
# interchangeable: only a `profiles: ["shape-dropped"]` block parks a
# service, and that marker is what lobes reads back (see
# lobes/runtime/_compose.py's shape_parked_service_keys).
services:
  vllm-hand:
    profiles: ["shape-dropped"]
  vllm-multimodal:
    profiles: ["shape-dropped"]
  vllm-primary:
    profiles: ["shape-dropped"]
