  // ---------------------------------------------------------------- mesh model
  function meshModel(mesh) {
    var members = mesh.members || [], splitOf = {}, pairOf = {}, groups = {};
    (mesh.split_brains || []).forEach(function (s) { splitOf[s.model] = s; });

  function partLabel(l, M) {

  function stepState(st, idx, steps) {
    var last = steps.indexOf(st.last_step);
    if (st.done || idx < last) return ["Done", "var(--ok)", 400];
    if (last < 0) return ["Waiting", "var(--faint)", 400];
    if (idx === last) {
      if (st.last_result === "ok") return ["Done", "var(--ok)", 400];
      if (st.last_result === "failed") return ["Failed", "var(--crit)", 700];
      if (st.last_result === "skipped_offline") return ["Offline", "var(--warn)", 700];
      return [st.last_result || "Running", "var(--accent)", 700];
    }
    return [st.last_result === "failed" ? "Skipped" : "Waiting", "var(--faint)", 400];
  }
  function waveState(st, resume) {
    if (st.done) return { label: "Verified", color: "var(--ok)", bg: "var(--ok)", fg: "var(--surface)", border: "var(--ok)", icon: CHECK };
    if (st.last_result === "failed") return { label: "Halted", color: "var(--crit)", bg: "var(--crit)", fg: "var(--surface)", border: "var(--crit)", icon: CROSS };
    if (st.state === "pending") return { label: "Offline, skipped", color: "var(--warn)", bg: "var(--surface)", fg: "var(--ink)", border: "var(--warn)", icon: BANG };
    var here = resume && resume.member === st.member;
    return { label: here ? "Next: " + stepName(resume.step) : "In progress", color: "var(--accent)", bg: "var(--accent)", fg: "var(--surface)", border: "var(--accent)", icon: null };
  }
  function rolloutView() {
    var R = S.data.rollout;
    if (!R) return S.err.rollout ? errorBox("rollout") : '<p class="empty">Loading</p>';
    var ms = R.members || [], steps = R.steps || [], h = [], targets = {};
    ms.forEach(function (m) { if (m.target) targets[m.target] = (targets[m.target] || 0) + 1; });
    var target = Object.keys(targets).sort(function (a, b) { return targets[b] - targets[a]; })[0] || null;
    var failed = ms.filter(function (m) { return m.last_result === "failed" && !m.done; });
    var done = ms.filter(function (m) { return m.done; });
    var pre = target ? target + ": " : "", head;
    if (!ms.length) head = "No rollout yet";
    else if (failed.length) head = pre + "halted at " + failed.map(function (m) { return m.member; }).join(", ");
    else if (done.length === ms.length) head = pre + "every member verified";
    else head = pre + done.length + " of " + ms.length + " verified";
    h.push('<div class="row" style="justify-content:space-between;align-items:flex-end"><h1 class="big">' + esc(head) + "</h1>" + refreshBtn("rollout") + "</div>");
    if (!ms.length) {
      h.push('<section class="card" aria-label="Run it" style="margin-top:28px;padding:18px 22px"><div class="row"><div class="grow" style="font-weight:700;min-width:200px">The rollout journal is empty</div>' + copyBtn("lobes rollout plan") + "</div></section>");
      return h.join("");
    }
    h.push('<section class="card boxscroll" aria-label="Waves" style="margin-top:36px;padding:28px 28px 24px"><ol class="waves" style="grid-template-columns:repeat(' + ms.length + ',minmax(180px,1fr));min-width:' + ms.length * 200 + 'px">');
    ms.forEach(function (m, i) {
      var w = waveState(m, R.resume), last = i === ms.length - 1;
      var badge = w.icon ? icon(w.icon, 12, w.border) : esc(i + 1);
      var ver = m.current || m.target ? (m.current || "?") + (m.target && m.target !== m.current ? " → " + m.target : "") : "";
      h.push('<li><div style="display:flex;align-items:center"><span style="flex:none;position:relative;width:64px;height:64px">' +
        '<svg width="64" height="64" viewBox="0 0 120 120" aria-hidden="true"><path d="' + BRAIN_L + " " + BRAIN_R + '" fill="' + w.bg + '" stroke="' + w.border + '" stroke-width="4" stroke-linejoin="round"></path><circle cx="60" cy="58" r="8" fill="' + w.fg + '"></circle></svg>' +
        '<span style="position:absolute;right:-2px;bottom:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid ' + w.border + ';font-size:12px;font-weight:900">' + badge + "</span></span>" +
        (last ? "" : '<span class="wline" aria-hidden="true" style="background:' + (m.done ? "var(--ok)" : "var(--track)") + '"></span>') + "</div>" +
        '<div style="margin-top:14px;font-size:13px;color:var(--soft)">Wave ' + (i + 1) + "</div>" +
        '<div style="font-weight:700;font-size:1.35rem;line-height:1.2;overflow-wrap:anywhere">' + esc(m.member) + "</div>" +
        '<div style="font-size:14px;font-weight:700;margin-top:4px;color:' + w.color + '">' + esc(w.label) + "</div>" +
        (ver ? '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px"><span class="chip">' + esc(ver) + "</span></div>" : "") + "</li>");
    });
    h.push("</ol></section>");
    failed.forEach(function (m) {
      h.push('<section class="halt" aria-label="Rollout halted"><div class="t">' + icon("M12 7v6M12 16.5h.01", 18, "currentColor") +
        "<span>" + esc(m.member + " halted at " + stepName(m.last_step)) + "</span></div>" +
        (m.rollback_command ? '<div class="row" style="margin-top:12px">' + copyBtn(m.rollback_command) + "</div>" : "") + "</section>");
    });
    h.push('<section class="card" aria-label="Member steps" style="margin-top:20px;padding:20px 22px"><h2 class="sec">Steps</h2><div class="boxscroll"><table style="min-width:' + (220 + ms.length * 130) + 'px"><thead><tr><th scope="col">Step</th>');
    ms.forEach(function (m) { h.push('<th scope="col" style="color:var(--ink)">' + esc(m.member) + "</th>"); });
    h.push("</tr></thead><tbody>");
    steps.forEach(function (s, idx) {
      h.push('<tr><th scope="row" style="font-weight:400">' + esc(stepName(s)) + "</th>");
      ms.forEach(function (m) { var c = stepState(m, idx, steps); h.push('<td style="color:' + c[1] + ";font-weight:" + c[2] + '">' + esc(c[0]) + "</td>"); });
      h.push("</tr>");
    });
    h.push("</tbody></table></div></section>");
    var cta;
    if (failed.length) cta = [failed[0].member + ": your call", failed[0].rollback_command || "lobes rollout status"];
    else if (R.resume) cta = ["Resume at " + R.resume.member + ", " + stepName(R.resume.step), "lobes rollout apply --apply"];
    else if (done.length === ms.length) cta = ["Done", "lobes rollout status"];
    else cta = ["Next wave", "lobes rollout apply --apply"];
    h.push('<section class="card" aria-label="Run it" style="margin-top:20px;padding:18px 22px"><div class="row"><div class="grow" style="font-weight:700;min-width:200px">' + esc(cta[0]) + "</div>" + copyBtn(cta[1]) + "</div></section>");
    return h.join("");
  }

  // ---------------------------------------------------------------- residents
  var COLS = [["ssh", "SSH"], ["user", "User"], ["port", "Port"], ["lobes_path", "lobes"], ["gateway_key", "Gateway key"]];
  function fieldCell(name, f) {
    if (!f || f.state !== "detected") {
      return '<span class="inp"><span class="ico" style="color:var(--warn)">' + icon(BANG, 14, "currentColor") + '</span><span style="color:var(--warn);font-weight:700">needs you</span></span>';
    }
    var v = f.value, warn = false;
    if (name === "gateway_key") { if (v === false) { v = "none (open)"; warn = true; } else v = "set"; }
    else if (v === true) v = "yes"; else if (v === false) v = "no";
    return '<span class="inp"><span class="ico" style="color:' + (warn ? "var(--warn)" : "var(--ok)") + '">' + icon(warn ? BANG : CHECK, 14, "currentColor", warn ? "needs you" : "detected") +
      '</span><span style="font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:' + (warn ? "var(--warn)" : "var(--ink)") + '">' + esc(v) + "</span></span>";
  }
  function needsList(r) {
    var n = (r.needs_you || []).slice(), k = r.fields && r.fields.gateway_key;
    if (k && k.state === "detected" && k.value === false) n.push("gateway_key (open)");
    return n;
  }
  function tomlVal(name, v) {
    if (name === "gateway_key" && typeof v !== "boolean") return '"<set>"';
    if (typeof v === "boolean") return v ? "true" : "false";
    if (typeof v === "number") return String(v);
    return '"' + String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  }
  function fileText(D) {
    var out = ['# generated by lobes from the mesh roster; fix lines marked "fix:"'];
    [["resident", D.residents || []], ["guest", D.guests || []]].forEach(function (g) {
      g[1].forEach(function (r) {
        out.push("", "[" + g[0] + "." + r.name + "]");
        COLS.forEach(function (c) {
          var f = r.fields[c[0]];
          out.push(f && f.state === "detected" ? c[0] + " = " + tomlVal(c[0], f.value) : "# fix: " + c[0] + " unknown");
        });
        if ((r.needs_you || []).length) out.push("needs_you = [" + r.needs_you.map(function (n) { return '"' + n + '"'; }).join(", ") + "]");
      });
    });
    return out.join("\n");
  }
  function residentsView() {
    var D = S.data.residents;
    if (!D) return S.err.residents ? errorBox("residents") : '<p class="empty">Loading</p>';
    var all = (D.residents || []).map(function (r) { return { r: r, guest: false }; }).concat((D.guests || []).map(function (r) { return { r: r, guest: true }; }));
    var nNeeds = all.filter(function (x) { return needsList(x.r).length; }).length, nGuests = (D.guests || []).length;
    var rows = all.filter(function (x) { return S.resFilter === "all" || (S.resFilter === "needs" && needsList(x.r).length) || (S.resFilter === "guests" && x.guest); });
    var h = ['<div class="row" style="gap:14px 20px"><h1 class="mid">Residents</h1><code class="cmd" style="color:var(--soft);background:var(--surface);border-color:var(--line)">' + esc(D.file) + "</code>"];
    h.push('<div class="seg" role="group" aria-label="Filter" style="margin-left:auto">');
    [["all", "All", all.length], ["needs", "Needs you", nNeeds], ["guests", "Guests", nGuests]].forEach(function (t) {
      h.push('<button type="button" data-act="filter" data-f="' + t[0] + '" data-k="filter:' + t[0] + '" aria-pressed="' + (S.resFilter === t[0]) + '">' + t[1] + ' <span class="n">' + t[2] + "</span></button>");
    });
    h.push("</div>" + refreshBtn("residents") + "</div>");
    h.push('<div class="row" style="gap:8px 18px;margin-top:14px;font-size:13px;color:var(--soft)">' +
      '<span class="inp"><span class="ico" style="color:var(--ok)">' + icon(CHECK, 14) + "</span>detected</span>" +
      '<span class="inp"><span class="ico" style="color:var(--warn)">' + icon(BANG, 14) + "</span>needs you</span>" +
      '<span class="inp"><span class="ico" style="color:var(--info)">' + icon(PLUS, 14) + "</span>guest</span></div>");
    h.push('<section class="card boxscroll" aria-label="Residents" style="margin-top:16px"><table style="min-width:900px"><caption class="sr">Residents file</caption><thead><tr><th scope="col">Machine</th>');
    COLS.forEach(function (c) { h.push('<th scope="col">' + c[1] + "</th>"); });
    h.push("</tr></thead><tbody>");
    if (!all.length) h.push('<tr><td colspan="6" class="empty">No residents file yet.</td></tr>');
    else if (!rows.length) h.push('<tr><td colspan="6" class="empty">None.</td></tr>');
    rows.forEach(function (x) {
      var r = x.r, color = x.guest ? "var(--info)" : "var(--accent)";
      h.push('<tr style="background:' + (x.guest ? "var(--accent-tint)" : "transparent") + '"><th scope="row"><span style="display:inline-flex;align-items:center;gap:10px">' +
        '<svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true"><path d="' + BRAIN_L + " " + BRAIN_R + '" fill="var(--shell)" stroke="' + color + '" stroke-width="7" stroke-dasharray="' + (x.guest ? "10 8" : "none") + '" stroke-linejoin="round"></path><circle cx="60" cy="58" r="10" fill="' + color + '"></circle></svg>' +
        "<span>" + esc(r.name) + (x.guest ? ' <span class="chip">guest</span>' : "") + "</span></span></th>");
      COLS.forEach(function (c) { h.push("<td>" + fieldCell(c[0], r.fields[c[0]]) + "</td>"); });
      h.push("</tr>");
    });
    h.push("</tbody></table></section>");
    var fixes = [];
    all.forEach(function (x) { var n = needsList(x.r); if (n.length) fixes.push("<li><b>" + esc(x.r.name) + "</b> " + esc(n.join(", ")) + "</li>"); });
    h.push('<div class="row" style="align-items:flex-start;gap:16px;margin-top:16px">');
    h.push('<section class="card" aria-label="File" style="flex:2 1 520px;min-width:0;padding:16px 18px"><div class="row" style="gap:10px;margin-bottom:10px"><h2 class="sec" style="margin:0">' + esc(D.file) + "</h2>" +
      (nNeeds ? '<span class="chip" style="background:var(--warn-tint);color:var(--warn)">' + nNeeds + " to fix</span>" : "") + '</div><pre class="file" tabindex="0" aria-label="' + esc(D.file) + '">' + esc(fileText(D)) + "</pre></section>");
    h.push('<section class="card" aria-label="Needs you" style="flex:1 1 320px;min-width:0;padding:16px 18px"><h2 class="sec">Needs you</h2>' +
      (fixes.length ? '<ul class="stack" style="list-style:none;margin:0;padding:0;font-size:14px">' + fixes.join("") + "</ul>" : '<p style="margin:0;color:var(--soft)">Nothing.</p>'));
    (D.guests || []).forEach(function (g) { h.push('<div style="margin-top:12px">' + copyBtn("lobes mesh resident add " + g.name) + "</div>"); });
    h.push("</section></div>");
    return h.join("");
  }

  // ---------------------------------------------------------------- render + events
  function render() {
    var ae = document.activeElement, key = ae && ae.getAttribute ? ae.getAttribute("data-k") : null;
    var main = document.getElementById("main");
    main.innerHTML = S.view === "rollout" ? rolloutView() : S.view === "residents" ? residentsView() : meshView();
    var navs = document.querySelectorAll("[data-nav]");
    for (var i = 0; i < navs.length; i++) {
      if (navs[i].getAttribute("data-nav") === S.view) navs[i].setAttribute("aria-current", "page"); else navs[i].removeAttribute("aria-current");
    }
    document.getElementById("self").textContent = S.data.mesh ? S.data.mesh.self : "";
    fit();
    if (key) {
      var els = main.querySelectorAll("[data-k]");
      for (var j = 0; j < els.length; j++) if (els[j].getAttribute("data-k") === key) { els[j].focus(); break; }
    }
  }
  function fit() {
    var els = document.querySelectorAll(".sizer");
    for (var i = 0; i < els.length; i++) {
      var z = els[i], w = +z.getAttribute("data-w"), hh = +z.getAttribute("data-h"), avail = z.parentNode.clientWidth;
      var sc = avail >= w ? 1 : avail / w >= 0.75 ? avail / w : 1;
      z.style.width = Math.floor(w * sc) + "px";
      z.style.height = Math.ceil(hh * sc) + "px";
      z.firstChild.style.transform = sc === 1 ? "" : "scale(" + sc.toFixed(4) + ")";
    }
  }
  window.addEventListener("resize", fit);
  function select(role, member) {
    var key = role + "@" + member;
    S.sel = { role: role, member: member };
    S.exp = { key: key, loading: true };
    render();
    getJSON(API.exp + "?role=" + encodeURIComponent(role) + "&member=" + encodeURIComponent(member)).then(function (d) {
      if (S.exp && S.exp.key === key) S.exp = { key: key, data: d };
    }, function (e) {
      if (S.exp && S.exp.key === key) S.exp = { key: key, error: e.message || String(e) };
    }).then(render);
  }
  function copy(btn) {
    var text = btn.getAttribute("data-text");
    function done(ok) {
      btn.textContent = ok ? "Copied" : "Select to copy";
      setTimeout(function () { btn.textContent = "Copy"; }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    else done(false);
  }
  document.addEventListener("click", function (ev) {
    var t = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "tab") { S.tab = t.getAttribute("data-tab"); render(); }
    else if (act === "lobe") select(t.getAttribute("data-role"), t.getAttribute("data-member"));
    else if (act === "copy") copy(t);
    else if (act === "filter") { S.resFilter = t.getAttribute("data-f"); render(); }
    else if (act === "refresh") load(t.getAttribute("data-what"));
  });
  document.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute || t.getAttribute("role") !== "tab" || (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft")) return;
    S.tab = S.tab === "graph" ? "table" : "graph";
    render();
    var n = document.getElementById("tab-" + S.tab);
    if (n) n.focus();
    ev.preventDefault();
  });
  function route() {
    var v = (location.hash || "#mesh").slice(1);
    S.view = v === "rollout" || v === "residents" ? v : "mesh";
    if (S.rollTimer) { clearInterval(S.rollTimer); S.rollTimer = null; }
    if (S.view === "rollout") S.rollTimer = setInterval(function () { if (!document.hidden) load("rollout"); }, 10000);
    render();
    load(S.view);
    if (S.view !== "mesh" && !S.data.mesh && !S.err.mesh) load("mesh");
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
