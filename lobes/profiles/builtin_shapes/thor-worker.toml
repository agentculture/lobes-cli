# The Jetson AGX Thor WORKER variant of a mesh-brain deployment: hosts the
# opt-in `worker` lobe (unsloth/Qwen3.6-35B-A3B-NVFP4 — the eighth Colleague
# role, the fast MULTIMODAL ground-work DOER) + the two pooling gears + the
# audio overlay, and drops BOTH heavy default lobes to peer boxes — no Qwen
# `cortex` (lives on a spark-lobe box) and no Gemma 12B `senses` (lives on a
# peer box too; declare MULTIMODAL_PEER_ORIGIN in the deployment's .env).
#
# `worker` is an OPT-IN core role (lobes/profiles/shapes.py's
# OPT_IN_CORE_ROLES): machine-as-brain never hosts it — a 35B MoE cannot
# co-reside with the cortex+senses duo on a 128 GB box — so THIS shape carries
# worker's FULL declaration (model + budget knobs) in its overrides and the
# card profiles stay silent on it (base.toml vetoes it for unrecognised cards).
# Hosting worker renders its activation env (COMPOSE_PROFILES=worker un-gates
# the profile-gated vllm-worker service; WORKER_BASE_URL wires the gateway
# backend — see shape_render.OPT_IN_CORE_ACTIVATION_ENV).
#
# This shape replaces thor-muse on the physical Thor (the mesh moved off the
# 31B muse to the faster MoE worker). muse goes dormant/unhosted.
#
# Budget values below are MEASURED on the physical Jetson AGX Thor (sm_110),
# 2026-07-31 live boot — see docs/evidence/2026-07-31-accept-worker-thor.txt.
# vLLM 0.23.1rc1.dev672 (torch 2.11.0+cu130, arch_list includes sm_110).
#
# MEASURED at gpu_mem_util=0.45 / max_model_len=262144 (the FULL 256K native
# window, served — no trim needed):
#   * model weights loaded: 24.81 GiB (24.67 GiB checkpoint) in ~31 s
#   * KV-cache pool: 41.78 GiB = a 14.07x KV-POOL CEILING at 262,144
#     tokens/request (far more headroom than thor-muse's 2.33x — the ~3B-active
#     MoE + the mixed-precision NVFP4/fp8 weights leave a large KV budget)
#   * decode ~50.8 tok/s end-to-end SINGLE-STREAM; MTP self-draft acceptance 89.1%
#
# !!! 14.07x IS A CEILING, NOT MEASURED CONCURRENCY — AND NOT 14x50 tok/s !!!
# It is arithmetic: KV pool / max_model_len. It says how many FULL-CONTEXT
# requests the KV cache could hold, nothing about useful throughput at that
# width. Two independent consumers measured the real behaviour on this box
# (2026-07-31): usable concurrency SATURATES near width 8-9, not 14, and
# per-stream decode falls to ~30 tok/s at high width (embodiment, and
# colleague#361 which measured 29.8 tok/s/stream and 268.1 tok/s aggregate at
# width 14 — a 5.5% aggregate gain for a 75% load increase over width 8).
# The 50.8 tok/s above is a SINGLE-STREAM number; multiplying it by the ceiling
# is exactly the misreading to avoid. Quote the ceiling and the measured
# saturation together, or quote neither.
#   * co-resides with embedder+reranker (util 0.06 each) on the 128 GB box.
# The 0.45 hypothesis booted healthy on the FIRST try (unlike thor-muse, where
# 0.40 was refused and 0.55 measured) — the MoE's small active-param footprint
# is why. 0.45 is kept (not trimmed) so worker keeps generous concurrency and
# room for the audio overlay to co-reside.
#
# !!! sm_110 MoE-BACKEND (NOT a shape knob — lives in the compose lane) !!!
# The vllm-worker compose lane must NOT force --moe-backend on sm_110. Every
# forced value was REFUSED live: flashinfer_b12x / flashinfer_cutlass ("kernel
# does not support current device cuda" — flashinfer NVFP4 kernels are
# sm_121a/Spark-only), marlin ("not supported for unquantized MoE" — the
# self-hosted MTP experts are unquantized), triton ("not supported for NvFP4
# MoE"). Only AUTO-SELECT boots: vLLM picks TRITON for the unquantized/fp8 MoE
# and a modular NVFP4 kernel for the main experts. The committed compose omits
# the flag by default; WORKER_MOE_BACKEND is an opt-in hand-pin (e.g. a Spark
# box may pin flashinfer_b12x). See the evidence transcript.
name = "thor-worker"
summary = "Jetson AGX Thor worker-lobe -- Qwen3.6-35B-A3B multimodal worker + embedder + reranker + audio, no cortex/senses"


# `hand` (the ninth Colleague role, LFM2.5-1.2B) is hosted by EVERY built-in
# shape, including the mesh-lobe shapes that drop a heavy lobe. That is the
# point of the role: at ~2.4 GiB it is cheap enough to keep resident on every
# box, so a caller always has a local generate lane and a local fine-tuning
# base — and unlike muse/worker there is never a reason to refer it to a peer.
# Its budget comes from the CARD profile (per-card, see builtin/*.toml), not
# from a shape override: dropping another lobe does not change what hand needs.
hosts = ["worker", "hand", "embedder", "reranker", "stt", "tts"]

[overrides.worker]
# unsloth/Qwen3.6-35B-A3B-NVFP4: a MULTIMODAL (image+video, no audio) MoE with
# ~3B active params/token, 262144 native context, compressed-tensors NVFP4
# (mixed precision: fp8 attention/lm_head + nvfp4 experts), self-hosted MTP
# draft. Served multimodal (the compose lane omits --language-model-only) —
# VALIDATED live: red/blue image intake correct with a negative control, AND a
# real webcam video clip described accurately (subject/scene/motion).
model = "unsloth/Qwen3.6-35B-A3B-NVFP4"
# MEASURED 2026-07-31 (Thor sm_110): booted healthy at util 0.45, full 262144
# window, KV 41.78 GiB = 14.07x concurrency. See the header + evidence.
gpu_mem_util = 0.45
max_model_len = 262144
quantization = "compressed-tensors"
