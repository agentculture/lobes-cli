# The Jetson AGX Thor WORKER variant of a mesh-brain deployment: hosts the
# opt-in `worker` lobe (nvidia/Qwen3.6-35B-A3B-NVFP4 — the eighth Colleague
# role, the fast MULTIMODAL ground-work DOER) + the two pooling gears + the
# audio overlay, and drops BOTH heavy default lobes to peer boxes — no Qwen
# `cortex` (lives on a spark-lobe box) and no Gemma 12B `senses` (lives on a
# peer box too; declare MULTIMODAL_PEER_ORIGIN in the deployment's .env).
#
# `worker` is an OPT-IN core role (lobes/profiles/shapes.py's
# OPT_IN_CORE_ROLES): machine-as-brain never hosts it — a 35B MoE cannot
# co-reside with the cortex+senses duo on a 128 GB box — so THIS shape carries
# worker's FULL declaration (model + budget knobs) in its overrides and the
# card profiles stay silent on it (base.toml vetoes it for unrecognised cards).
# Hosting worker renders its activation env (COMPOSE_PROFILES=worker un-gates
# the profile-gated vllm-worker service; WORKER_BASE_URL wires the gateway
# backend — see shape_render.OPT_IN_CORE_ACTIVATION_ENV).
#
# This shape replaces thor-muse on the physical Thor (the mesh moved off the
# 31B muse to the faster MoE worker). muse goes dormant/unhosted.
#
# Budget values below are MEASURED on the physical Jetson AGX Thor (sm_110),
# 2026-09-10, on the fleet-pinned nightly 8bd082 (vLLM 0.26.1rc1.dev942) — see
# the [overrides.worker] block and docs/evidence/2026-09-10-*.
#
# --- SUPERSEDED, kept for the record (the unsloth occupant, 2026-07-31) ------
# The previous checkpoint measured at util 0.45 / max_model_len 262144 on vLLM
# 0.23.1rc1.dev672: weights 24.81 GiB in ~31 s, KV pool 41.78 GiB = a 14.07x
# ceiling at 262,144, decode ~50.8 tok/s single-stream, MTP acceptance 89.1%
# (docs/evidence/2026-07-31-accept-worker-thor.txt). Those numbers belong to a
# different checkpoint on a different engine and are NOT this shape's budget.
#
# !!! A KV CEILING IS NOT MEASURED CONCURRENCY, AND NOT ceiling x tok/s !!!
# A ceiling is arithmetic: KV pool / max_model_len. It says how many
# FULL-CONTEXT requests the cache could hold, nothing about useful throughput
# at that width. On the 2026-07-31 occupant, two independent consumers measured
# the real behaviour: usable concurrency SATURATED near width 8-9, not the
# 14.07x ceiling, and per-stream decode fell to ~30 tok/s at high width
# (embodiment; colleague#361 measured 29.8 tok/s/stream and 268.1 tok/s
# aggregate at width 14 — a 5.5% aggregate gain for a 75% load increase over
# width 8). The same warning applies to the 32.05x / 21.04x ceilings recorded
# below: quote a ceiling and the measured saturation together, or quote
# neither. NO concurrency measurement exists for the current checkpoint.
#
# worker co-resides with embedder+reranker (util 0.06 each) on the 128 GB box.
#
# !!! sm_110 MoE-BACKEND (NOT a shape knob — lives in the compose lane) !!!
# The vllm-worker compose lane must NOT force --moe-backend. The rule is
# unchanged from the unsloth era, but 2026-09-10 measured the REASON precisely,
# and it is not what the earlier note assumed:
#
#   With MTP on, the engine selects TWO MoE backends AT ONCE. The target's
#   experts are W4A16_NVFP4 -> "Using 'MARLIN' NvFp4 MoE backend". The DRAFT's
#   experts are UNQUANTIZED (this export excludes `mtp*` from quantization)
#   -> "Using TRITON Unquantized MoE backend". Attention independently selects
#   FLASHINFER. All three on sm_110, all by auto-select.
#
# So the 2026-07-31 refusals (marlin "not supported for unquantized MoE";
# flashinfer_* "kernel does not support current device") were never an sm_110
# fact — they were ONE forced value applied to two differently-quantized MoEs.
# Marlin genuinely IS the right kernel for the target's experts here; it simply
# cannot also be the drafter's. WORKER_MOE_BACKEND stays unset.
#
name = "thor-worker"
summary = "Jetson AGX Thor worker-lobe -- Qwen3.6-35B-A3B multimodal worker + embedder + reranker + audio, no cortex/senses"


# `hand` (the ninth Colleague role, LFM2.5-1.2B) is hosted by EVERY built-in
# shape, including the mesh-lobe shapes that drop a heavy lobe. That is the
# point of the role: at ~2.4 GiB it is cheap enough to keep resident on every
# box, so a caller always has a local generate lane and a local fine-tuning
# base — and unlike muse/worker there is never a reason to refer it to a peer.
# Its budget comes from the CARD profile (per-card, see builtin/*.toml), not
# from a shape override: dropping another lobe does not change what hand needs.
hosts = ["worker", "hand", "embedder", "reranker", "stt", "tts"]

[overrides.worker]
# nvidia/Qwen3.6-35B-A3B-NVFP4 — NVIDIA's own ModelOpt export, promoted to the
# worker seat by issue #244. MULTIMODAL (its own deepstack ViT; image intake
# VALIDATED live with negative controls, video DECLARED-not-measured), MoE with
# 256 experts / 8 active, 262144 native, ModelOpt MIXED_PRECISION (experts
# W4A16_NVFP4 weight-only + FP8 linear_attn, FP8 KV declared), and a
# self-hosted MTP head. Served multimodal — the compose lane omits
# --language-model-only.
model = "nvidia/Qwen3.6-35B-A3B-NVFP4"
# MEASURED on the physical Thor (sm_110), 2026-09-10 — see
# docs/evidence/2026-09-10-accept-nvidia-35b-a3b-thor.txt and
# docs/evidence/2026-09-10-sweep-mtp-depth-nvidia-35b-a3b-thor.txt.
#
#   util 0.45 @ max_model_len 65536 booted first try:
#     weights            20.37 GiB, loaded in 44.2 s
#     KV pool (no spec)  2,100,601 tokens = 32.05x ceiling at 65536
#     KV pool (MTP n=3)  1,379,105 tokens = 21.04x ceiling
#     decode, single-stream, streaming, batch 1:
#         no speculation  68.5 tok/s   (median of 3)
#         MTP n=1        101.8
#         MTP n=3        129.0
#         MTP n=5        136.7   <- highest acceptance of the fast arms, 96.2%
#         MTP n=7        155.3   <- fastest, but positions 5/6 accepted 33%/22%
#
# !!! THE WINDOW IS 262144 — RAISED FROM 65536 BY A CONSUMER FAILURE !!!
# The sweep above was measured at 65536, but the DEPLOYED lane serves the full
# native 262144, because a real consumer broke on the smaller window: Qwen Code
# requests 64000 output tokens by default and returned
#   HTTP 400: maximum context length is 65536 ... you requested 64000 output
# 262144 booted cleanly at the same util (KV pool 1,199,883 tokens = 4.58x
# ceiling) and is what the box runs — see
# docs/evidence/2026-09-10-accept-thor-worker-flip.txt. The 65536 sweep numbers
# are still the honest speculation comparison; they are just not the window.
# A window shrink breaks consumers that size max_tokens against the old window,
# which no model-id audit catches.
#
# util 0.45 was the FIRST hypothesis and it booted, so it is "sufficient", not
# "optimal" — no lower or higher budget was explored.
gpu_mem_util = 0.45
max_model_len = 262144
# ModelOpt MIXED_PRECISION resolves to `modelopt_mixed` in the engine; pass
# `modelopt` (the outgoing unsloth export needed `compressed-tensors` — a
# different quant family, and passing the wrong one fails on a method mismatch).
quantization = "modelopt"
kv_cache_dtype = "fp8"
max_num_seqs = 1
speculative_config = '''"'--speculative-config={\"method\": \"dflash\", \"num_speculative_tokens\": 12, \"model\": \"z-lab/Qwen3.6-35B-A3B-DFlash\"}'"'''
