# The DGX Spark half of a mesh-brain deployment (brain-shapes t1, issue #113):
# keeps the Qwen `cortex` primary + the two pooling gears + the audio overlay
# on this box, and drops the Gemma `senses` lobe to a peer box (today, the
# Jetson AGX Thor running thor-lobe.toml) instead of co-residing it here.
#
# Differs from machine-as-brain.toml in `hosts` (senses dropped) and, as of
# brain-shapes t2/t2b, `overrides` -- cortex gets its FULL NATIVE budget now
# that it no longer shares the box with senses. Co-residency previously capped
# cortex at util 0.30 / 131072 tokens (see CLAUDE.md's "Colleague roles"); as
# of t2b (issue #113, user decision on the PR), that trim's reason is gone --
# senses is dropped from this shape entirely, not just downsized -- so cortex
# rises to its full native budget in THIS task, not deferred to #112.
name = "spark-lobe"
summary = "DGX Spark mesh-lobe -- Qwen cortex + embedder + reranker + audio, no Gemma senses"


# `hand` (the ninth Colleague role, LFM2.5-1.2B) is hosted by EVERY built-in
# shape, including the mesh-lobe shapes that drop a heavy lobe. That is the
# point of the role: at ~2.4 GiB it is cheap enough to keep resident on every
# box, so a caller always has a local generate lane and a local fine-tuning
# base — and unlike muse/worker there is never a reason to refer it to a peer.
# Its budget comes from the CARD profile (per-card, see builtin/*.toml), not
# from a shape override: dropping another lobe does not change what hand needs.
hosts = ["cortex", "hand", "embedder", "reranker", "stt", "tts"]

[overrides.cortex]
# --- pre-t5 history (unsloth/Qwen3.6-27B-NVFP4, retained for rollback) ------
# gpu_mem_util = 0.44 -- the co-resident reclaim-sum: 0.30 (cortex, spark
# co-resident) + 0.14 (senses, spark co-resident), reclaimed because senses is
# dropped from this shape. NOT the historical 0.60 solo value: the GB10's
# 121.69 GiB is UNIFIED memory shared with the host OS and its services, and
# the 2026-07-14 live boot measured only 59.35 GiB free at primary startup --
# vLLM refuses util 0.60 (73.01 GiB) outright on a box that also runs the
# pooling gears, the audio sidecars, and ordinary host workloads. 0.44
# (53.5 GiB) fits that measured reality with margin. (Live transcript:
# lobes-accept-spark-lobe-20260714; issue #113.)
#
# max_model_len = 262144 -- the checkpoint's own native context (256K),
# previously trimmed to 131072 only so cortex could co-reside with senses on
# the single-box shape. Senses is dropped in THIS shape, so the trim's reason
# is gone -- reclaimed here (issue #113, user decision on the PR), not deferred
# to #112.
#
# RE-VALIDATED 2026-07-31 for the MULTIMODAL cortex (unsloth/Qwen3.6-27B-NVFP4,
# which replaced the text-only sakamakismile MTP export). BOTH values below
# survived the checkpoint change unchanged -- it booted FIRST TRY at 0.44 /
# 262144, no retune, despite the export adding an unquantized bf16 ViT:
#   * KV pool 26.39 GiB = 756,642 tokens = ~2.89x concurrency at the full 256K
#     window, vs the outgoing text-only primary's 888,946 / 3.39x at these same
#     knobs -- so the ViT costs ~132,300 tokens (~15%) of KV pool and the full
#     window still fits.
#   * embedder + reranker + embed-deep all stayed co-resident and healthy.
#   * decode 14.9 / 16.4 / 19.0 tok/s (short/medium/512-tok gen), TTFT ~0.27s,
#     self-hosted MTP engaging at 62-67% draft acceptance.
#   * VISION VALIDATED on this shape: image intake against an opposite-colour
#     negative control, and VIDEO intake against a REVERSED-motion control.
# Transcript: docs/evidence/2026-07-31-accept-multimodal-cortex-spark.txt.
#
# The MEASURED 0.44 / 262144 pair above is the rollback value if the t7 boot
# below refuses the 1M hypothesis: an operator can restore it verbatim by
# setting gpu_mem_util = 0.44 / max_model_len = 262144 / hf_overrides =
# (unset) / allow_long_max_model_len = (unset) in a local override.
#
# --- t5 (devague plan lobes-adopts-qwen3.8-27b-nvfp4-as-cortex-p) ----------
# model swap to unsloth/Qwen3.8-27B-NVFP4 (spark.toml's own comment records
# the swap rationale) PLUS the 1M-token YaRN reach -- DECLARED HYPOTHESIS,
# pending the live t7 boot (the repo's measured-not-declared rule, same as
# thor-muse's util before its first live boot):
#
#   gpu_mem_util = 0.60 -- HYPOTHESIS, not measured. The historical solo 0.60
#   was REFUSED on the 3.6/text-only checkpoints (see the pre-t5 history
#   above -- 59.35 GiB free at boot vs 73.01 GiB demanded). t7 boots THIS
#   value first against 3.8's own ~2.4 GiB larger footprint (an unquantized
#   ViT identical to 3.6's) at the wider 1M KV window; if it is refused again,
#   t7 reclaims budget from the other co-resident gears (embedder/reranker/
#   embed-deep) rather than giving up the 1M reach (operator decision,
#   docs/specs/2026-08-19-qwen3-8-cortex-upgrade.md).
#
#   max_model_len = 1048576 -- HYPOTHESIS. 1M (1048576) is reachable ONLY via
#   the YaRN hf_overrides below; the checkpoint's own native ceiling is
#   262144 (256K), so serving beyond it needs BOTH the rope-scaling override
#   AND allow_long_max_model_len (vLLM refuses --max-model-len past a
#   checkpoint's declared ceiling otherwise).
#
#   hf_overrides -- VERIFIED against the checkpoint's own config.json
#   (fetched 2026-08-19; see lobes/catalog.py's unsloth/Qwen3.8-27B-NVFP4
#   entry). Stock text_config.rope_parameters:
#     {"mrope_interleaved": true, "mrope_section": [11, 11, 10],
#      "partial_rotary_factor": 0.25, "rope_theta": 10000000,
#      "rope_type": "default"}
#   The override below changes ONLY rope_type ("default" -> "yarn") and adds
#   factor 4.0 + original_max_position_embeddings 262144 (262144 * 4 =
#   1048576, the requested 1M window); every other stock field
#   (mrope_interleaved, mrope_section, partial_rotary_factor, rope_theta) is
#   preserved byte-for-byte, so nothing about the checkpoint's rotary/mrope
#   behaviour changes except the requested scale-up.
#
#   allow_long_max_model_len = "1" -- required alongside max_model_len
#   1048576: vLLM refuses to serve past a checkpoint's declared ceiling
#   (262144) without VLLM_ALLOW_LONG_MAX_MODEL_LEN=1, YaRN override or not.
#
# Renders ONLY on this shape (compose_profile overlays these onto the spark
# card's cortex role) -- every other card/shape (machine-as-brain, thor-lobe,
# thor-muse, thor-worker, orin-small, base) is untouched: none of them
# declare a [overrides.cortex] table with these knobs, so their composed
# Profile carries hf_overrides=None / allow_long_max_model_len=None and
# renders nothing for either key (profile_env's "None = no opinion"
# convention) -- byte-identical to before t5 for those renders.
gpu_mem_util = 0.60
max_model_len = 1048576
hf_overrides = '{"text_config": {"rope_parameters": {"rope_type": "yarn", "factor": 4.0, "original_max_position_embeddings": 262144, "mrope_interleaved": true, "mrope_section": [11, 11, 10], "partial_rotary_factor": 0.25, "rope_theta": 10000000}}}'
allow_long_max_model_len = "1"
