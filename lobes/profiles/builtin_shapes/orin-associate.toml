# The Jetson AGX Orin 64GB ASSOCIATE variant of a mesh-brain deployment: hosts
# the opt-in `associate` lobe (NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4 —
# the tenth Colleague role) plus the two pooling gears (`embedder`,
# `reranker`), and drops BOTH heavy default lobes to peers — no llama.cpp
# `cortex` (lives on this same board under `orin-cortex`, or on a peer) and no
# Gemma `senses` (lives on a peer, e.g. via `orin-lobe` on a different Orin, or
# the Spark/Thor duo). `hand` is NOT hosted here (see the note below `hosts`) —
# a correction from this shape's original SOLO form, which hosted no gear at
# all; the 2026-09-13 A/B (below) exercised associate co-resident with
# embed+rerank, and this file now matches what was actually measured.
#
# It is a THIRD answer alongside `orin-cortex` and `orin-lobe` to the same
# exclusive_roles group in builtin/orin.toml ([cortex, senses, associate]):
# each of the three shapes hosts exactly one member of that group and drops
# the other two.
#
# `associate` is an OPT-IN core role (lobes/profiles/shapes.py's
# OPT_IN_CORE_ROLES = ("muse", "worker", "associate")): machine-as-brain never
# hosts it, and — per approved deviation d1 (2026-08-25,
# .devague/deliveries/lightning-on-orin.json), which corrected t8's original
# criterion — the CARD stays silent on it (builtin/orin.toml's
# `[roles.associate]` declares `feasible = false` and keeps the measured
# numbers as DOCUMENTATION only). THIS shape carries the full declaration
# (model + budget knobs) in its own overrides, exactly the pattern
# `thor-muse.toml` and `thor-worker.toml` use for their opt-in lobes. Hosting
# associate renders its activation env (COMPOSE_PROFILES=associate un-gates
# the profile-gated vllm-associate service; ASSOCIATE_BASE_URL wires the
# gateway backend — see shape_render.OPT_IN_CORE_ACTIVATION_ENV).
#
# DECLARED, NOT VALIDATED (#108). The budget below is MEASURED live on the
# physical Jetson AGX Orin at the FULL 1,048,576-token native window,
# 2026-09-13 (docs/evidence/2026-09-13-measure-associate-budget-orin-1m.txt —
# the A/B against useful-quants/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-W4A16,
# which did NOT clear the operator's >= 10% win rule and was NOT adopted; see
# that file's "Verdict" section). The LANE itself was a confirmed GO earlier
# (docs/evidence/2026-08-25-spike-lightning-vllm-orin.txt: known-answer PASS,
# structured tool calls PASS, ~78-81 tok/s single-stream with DSpark
# speculation). But no box has booted this SHAPE, and no acceptance transcript
# exists for it — nothing here, in any doc, or in `lobes capabilities` output
# may claim this shape validated until one lands.
name = "orin-associate"
summary = "Jetson AGX Orin 64GB associate-lobe (DECLARED, UNVALIDATED) -- Lightning associate at its full 1M native window + embedder + reranker, no cortex/senses/hand, no audio"


# `hand` (the ninth Colleague role, LFM2.5-1.2B) is hosted by EVERY OTHER
# built-in shape, including the mesh-lobe shapes that drop a heavy lobe — it is
# cheap enough (~2.4 GiB) to keep resident everywhere, so a caller always has a
# local generate lane and a local fine-tuning base. THIS shape is the
# exception: the 2026-09-13 A/B that measured the budget below never started
# `hand`, and at the full 1,048,576-token window the associate engine alone
# leaves only ~2.6 GiB of host memory free on a ZERO-swap board (see the
# override comment) — there is no margin left for hand's ~5.8 GiB resident
# footprint (orin.toml's own [roles.associate] documentation records hand
# holding 59% more than its declared util implies). A box on this shape has no
# pressure-policy servable floor at all; adding hand back is open follow-up
# work once headroom is found (issue #216), not a decision this task makes.
hosts = ["associate", "embedder", "reranker"]

[overrides.associate]
# The full associate declaration lives HERE (not on the card) — see the header
# comment and approved deviation d1. nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-
# A3B-NVFP4: a Mamba-2/MoE/attention hybrid, ~3B active of 30B total params,
# 1,048,576-token native ceiling. Its OWN hf_quant_config.json (fetched
# 2026-08-25) is quant_algo="MIXED_PRECISION" — W4A16_NVFP4 (weight-only) on
# every routed/shared expert, FP8 on the mixer in_proj/out_proj, FP8 KV-cache
# quant — NOT the W4A4 activation quantization that rules out cortex/muse's
# NVFP4 exports on this sm_87 board. vLLM v0.27.1 accepted
# quantization=modelopt_mixed here and selected a full Marlin fallback stack
# (MarlinFP8ScaledMMLinearKernel, MarlinNvFp4LinearKernel, MARLIN NvFp4 MoE)
# plus native FlashAttention 2 — see
# docs/evidence/2026-08-25-spike-lightning-vllm-orin.txt. The 2026-09-13 1M A/B
# re-confirmed the same kernel selection at the new window and separately
# measured a W4A16 candidate (useful-quants/NVIDIA-Nemotron-3.5-Lightning-30B-
# A3B-W4A16, compressed-tensors GPTQ INT4 g64) side by side; it did not beat
# NVFP4 by the required margin, so the model stays unchanged.
model = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
#
# === 2026-09-13: THE FULL 1,048,576-TOKEN NATIVE WINDOW (current) ===========
#
# gpu_mem_util 0.70, max_model_len 1048576, max_num_batched_tokens 8192 and
# max_num_seqs 2 are ALL measured together, live on the physical Jetson AGX
# Orin, 2026-09-13
# (docs/evidence/2026-09-13-measure-associate-budget-orin-1m.txt) — the same
# quadruple as the live Orin's pre-change hand-typed `.env` (see "Before
# state" in that file), now promoted into this shape's declaration. Unlike
# every earlier measurement on this shape, the boot order was
# ASSOCIATE-FIRST: the associate engine was booted to healthy BEFORE embed and
# rerank were started, not gears-first as the 2026-08-26 measurement below
# was. gpu_memory_utilization is a fraction of the WHOLE device checked at
# startup, so 0.70 is a value proven for an associate-first boot with the two
# pooling gears NOT yet resident — it has not been measured gears-first at
# this window, and dropping `hand` from `hosts` (above) removes the other
# variable the earlier 0.56/0.80 measurements had to account for.
#
# Booted clean at util 0.70 / max_model_len 1048576: weights + non-torch
# 24.61 GiB, available KV cache memory 17.34 GiB, GPU KV cache size
# 2,889,456 tokens = a 2.76x CAPACITY CEILING at the full 1,048,576-token
# window (arithmetic — KV pool / max_model_len — not measured throughput; with
# max_num_seqs 2 the lane never actually runs more than two sequences at
# once, whatever the pool could hold). A cold 1,040,073-token needle PASSED
# (TTFT 2390.17 s, decode 7.98 tok/s at that depth); every probe (known-answer,
# multi-step, structured tool call) PASSED; the 2-session agentic run (12
# turns each, to ~118K tokens) PASSED with zero OOM. Minimum available host
# memory over the run was 2,588 MiB (during the 1.04M prefill) on this
# ZERO-swap board — thin, and the reason `hand` stays out of `hosts` above.
# Peak thermal (tegrastats) was 94.0 C. Zero container restarts, zero kernel
# OOM kills.
#
# OPERATIONAL FINDING, not a knob: embed failed its FIRST start every time the
# gears were started (together) right after the associate engine went
# healthy, with "ValueError: No available memory for the cache blocks", and
# recovered on Docker's own restart=unless-stopped retry (rerank restarted
# once too, without that error). This is the existing compose lane's
# restart policy doing its job, not a defect this task introduces — recorded
# here because it is a direct consequence of associate-first boot ordering.
#
# NO allow_long_max_model_len passthrough: the A/B set
# VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 on BOTH arms, but it is INERT for this
# checkpoint — NVFP4's own config.json already declares
# max_position_embeddings 1,048,576, so nothing here is "long" relative to the
# checkpoint. The flag was required only for the W4A16 candidate (whose config
# declares 262144) and that candidate was not adopted; see the model comment
# above.
gpu_mem_util = 0.70
max_model_len = 1048576
max_num_batched_tokens = 8192
max_num_seqs = 2
#
# === SUPERSEDED, kept for the record: the 128K / gears-first history ========
#
# gpu_mem_util 0.80 was MEASURED on the physical Orin with THIS FULL SHAPE up
# (in its earlier SOLO form, `hosts = ["associate"]`), 2026-08-26
# (docs/evidence/2026-08-26-accept-orin-associate.txt), GEARS-FIRST boot
# (hand/embedder/reranker resident before associate). The vendor's own
# published Jetson figure, 0.70, was REFUSED at that boot by 0.05 GiB with the
# two pooling gears resident:
#   "Free memory on device cuda:0 (42.89/61.34 GiB) on startup is less than
#    desired GPU memory utilization (0.7, 42.94 GiB)"
# 0.63 booted healthy in an earlier, hand-NOT-resident measurement: weights
# 19.45 GiB, available KV 10.95 GiB, KV pool 1,524,000 tokens, 11.91x
# concurrency at 128000 — then was ITSELF refused once `hand` joined the real
# shape ("Free memory on device cuda:0 (34.85/61.34 GiB) ... less than desired
# (0.63, 38.65 GiB)"). `hand` holds 5.84 GiB, not the 3.68 GiB its declared
# util 0.06 implies. See docs/evidence/2026-08-25-measure-associate-budget-
# orin.txt and builtin/orin.toml's [roles.associate] documentation block.
#
# max_model_len 128000 was the vendor recipe's window, served in full and
# measured at it — NOT the checkpoint's 1,048,576 native ceiling. It has now
# been superseded by the 1M measurement above: the checkpoint's native window
# is reachable on this board after all, at util 0.70 with associate booted
# first and hand dropped from the shape.
#
# Both refusal histories (0.70/0.63 at 128K gears-first, and the 0.70 solved
# at 1M associate-first) are kept here rather than collapsed into the
# surviving numbers — the boot-order and co-residency dependence is the point.
#
# modelopt -- Lightning's own quant_method; vLLM resolves it to
# modelopt_mixed and picks the Marlin fallback stack on sm_87 (see above).
quantization = "modelopt"
# bfloat16 -- NOT the checkpoint's declared FP8 kv_cache_quant_algo. sm_87 has
# no FP8 KV path; the vendor recipe concedes this too, and every number above
# (both the 1M and the superseded 128K measurements) was measured with
# --kv-cache-dtype bfloat16 in force.
kv_cache_dtype = "bfloat16"


# NO stt/tts -- inherited verbatim from orin-lobe/orin-cortex. This board
# CANNOT serve the audio overlay: MEASURED live 2026-07-17, the Parakeet STT
# image is built FROM `scitrera/dgx-spark-vllm`, whose bundled torch carries
# no sm_87 kernels -- the container crash-looped 8 times with "CUDA error: no
# kernel image is available for execution on the device". That is a
# build-artifact fact about the base image, not a budget question, so hosting
# `stt`/`tts` here would advertise two lanes that cannot start. Audio is
# forwarded to a peer via AUDIO_URL / the per-lane STT_PEER_ORIGIN /
# TTS_PEER_ORIGIN of #129, exactly as on orin-lobe and orin-cortex. `hosts`
# above names no audio role, so `shape_services` renders neither
# `stt`/`chatterbox`/`realtime` service, and `lobes init --audio` scaffolds
# the overlay file but this shape starts nothing from it.
