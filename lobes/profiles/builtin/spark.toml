# The default machine profile — DGX Spark (GB10 Grace Blackwell, 128 GB
# unified memory). Reproduces the fleet compose template's shipped defaults
# (lobes/templates/fleet/docker-compose.yml) EXACTLY, so resolving this
# profile changes nothing for an existing GB10 deployment: gpu_mem_util
# 0.30 / 0.14 / 0.06 / 0.06 and cortex max_model_len 131072 / senses 32768 /
# embedder+reranker 8192 are the "always-on duo" budget documented in
# CLAUDE.md ("Colleague roles") and docs/vllm-nightly-migration.md §8.
#
# A knob left out of a role table below means the profile takes no position
# on it (the compose template's own ${VAR:-default} applies) — see
# RoleProfile in lobes/profiles/schema.py.
name = "spark"
summary = "DGX Spark (GB10 Grace Blackwell, 128 GB unified) — the default, load-tested fleet profile"

[roles.cortex]
feasible = true
# unsloth/Qwen3.8-27B-NVFP4 — fleet default PRIMARY since 2026-08-19
# (t5 of devague plan lobes-adopts-qwen3.8-27b-nvfp4-as-cortex-p), replacing
# unsloth/Qwen3.6-27B-NVFP4 (demoted to `candidate`, kept per
# cite-don't-delete — see lobes/catalog.py). Same Qwen3_5ForConditionalGeneration
# arch, same publisher/export recipe, same self-hosted MTP draft and
# multimodal ViT the outgoing entry had — a checkpoint swap within the same
# engine-support family, not a new architecture bring-up. Adds a
# config-verified 1M-token YaRN reach the outgoing checkpoint's card never
# claimed (see builtin_shapes/spark-lobe.toml's [overrides.cortex]).
model = "unsloth/Qwen3.8-27B-NVFP4"
# !!! BUDGET BELOW IS INHERITED, NOT MEASURED FOR THIS CHECKPOINT !!!
# 0.30 / 131072 are the machine-as-brain DUO values (cortex co-resident with a
# local Gemma senses), measured for the PREVIOUS TWO checkpoints in turn (a
# text-only export, then the 3.6 multimodal export that re-validated them
# unchanged 2026-07-31). The 3.8 swap (t5) has NOT been booted on the duo
# shape at all — these two numbers are a carry-over hypothesis, unverified
# for this checkpoint, not a measurement. The 262144-native window and its
# 1M YaRN extension are being validated on the spark-lobe shape instead (t7),
# not the duo — see builtin_shapes/spark-lobe.toml's [overrides.cortex].
# A machine-as-brain GB10 booting the duo on 3.8 should expect to MEASURE
# these two values, exactly as thor-muse's refused 0.40 -> 0.55 taught
# (docs/machine-profiles.md).
gpu_mem_util = 0.30
max_model_len = 131072
# compressed-tensors (mixed precision: fp8 attn/lm_head + nvfp4 MLP), NOT the
# outgoing checkpoint's modelopt — using modelopt here fails on a quant-method
# mismatch.
quantization = "compressed-tensors"
kv_cache_dtype = "fp8"
max_num_seqs = 2

[roles.senses]
feasible = true
model = "coolthor/gemma-4-12B-it-NVFP4A16"
gpu_mem_util = 0.14
max_model_len = 32768
quantization = "compressed-tensors"
attention_backend = "TRITON_ATTN"

[roles.hand]
# The `hand` lobe (LiquidAI LFM2.5-1.2B-Instruct) — the fleet's fine-tuning
# base, default-hosted on every card. ~2.4 GiB of bf16 weights, text-only, no
# ViT, no thinking mode; served with --enable-lora ARMED and (in v1) an EMPTY
# adapter inventory. See docs/lfm2.5-1.2b-hand.md.
#
# quantization is DELIBERATELY ABSENT from this block, on every card: the
# catalog's quantization="none" bf16 sentinel means the lane must omit
# --quantization ENTIRELY. Declaring it here — even as an empty string — would
# render a flag that corrupts bf16 weights.
#
# BUDGET: DECLARED, NOT MEASURED (#108). 0.06 of a 128 GB GB10 is ~7.7 GiB —
# ~2.4 GiB of weights leaves ~5 GiB of KV at the 32K window, comfortable. The
# arithmetic is not the evidence, though: every co-residency number on this card
# was MEASURED because vLLM refused the computed one at least once. This card's
# total goes 0.56 -> 0.62 with hand added.
#
# The lane DID serve here at 0.06, three times, with every functional probe
# passing (docs/evidence/2026-08-10-partial-hand-spark.txt). The budget still
# stays DECLARED, because those three boots profiled three DIFFERENT KV pools —
# 6.21 / 3.34 / 3.54 GiB — tracking free memory at that instant rather than the
# util. On a unified-memory card with co-resident tenants a single boot's KV
# number measures the box's state, not the card's capacity; promoting one of
# them to MEASURED is exactly the error retracted on the Orin. See #183.
feasible = true
model = "LiquidAI/LFM2.5-1.2B-Instruct"
gpu_mem_util = 0.06
max_model_len = 32768

[roles.embedder]
feasible = true
model = "Qwen/Qwen3-Embedding-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192

[roles.reranker]
feasible = true
model = "Qwen/Qwen3-Reranker-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192
