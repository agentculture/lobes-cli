# The default machine profile — DGX Spark (GB10 Grace Blackwell, 128 GB
# unified memory). Reproduces the fleet compose template's shipped defaults
# (lobes/templates/fleet/docker-compose.yml) EXACTLY, so resolving this
# profile changes nothing for an existing GB10 deployment: gpu_mem_util
# 0.30 / 0.14 / 0.06 / 0.06 and cortex max_model_len 131072 / senses 32768 /
# embedder+reranker 8192 are the "always-on duo" budget documented in
# CLAUDE.md ("Colleague roles") and docs/vllm-nightly-migration.md §8.
#
# A knob left out of a role table below means the profile takes no position
# on it (the compose template's own ${VAR:-default} applies) — see
# RoleProfile in lobes/profiles/schema.py.
name = "spark"
summary = "DGX Spark (GB10 Grace Blackwell, 128 GB unified) — the default, load-tested fleet profile"

[roles.cortex]
feasible = true
# unsloth/Qwen3.6-27B-NVFP4 — the MULTIMODAL cortex, promoted 2026-07-31.
# Its ViT is VALIDATED on this card: served with the vision tower intact (no
# --language-model-only), image intake correct against an opposite-colour
# negative control, and VIDEO intake correct against a REVERSED-motion control
# (a single-frame read cannot pass that). Thinking, preserve_thinking (#93) and
# strict tool calling with thinking on (colleague#320) all re-verified.
# Transcript: docs/evidence/2026-07-31-accept-multimodal-cortex-spark.txt.
model = "unsloth/Qwen3.6-27B-NVFP4"
# !!! BUDGET BELOW IS INHERITED, NOT MEASURED FOR THIS CHECKPOINT !!!
# 0.30 / 131072 are the machine-as-brain DUO values (cortex co-resident with a
# local Gemma senses), measured for the previous TEXT-ONLY checkpoint. The
# unsloth export adds an unquantized bf16 ViT (333 visual tensors), so these
# numbers are a carry-over hypothesis for the duo shape — NOT a measurement.
# What WAS measured, on the spark-lobe shape (senses dropped to a peer, the
# shape this card actually runs today): gpu_mem_util 0.44 at the full 262144
# window — booted first try, KV pool 26.39 GiB / 756,642 tokens = ~2.89x
# concurrency. See builtin_shapes/spark-lobe.toml's [overrides.cortex].
# A machine-as-brain GB10 booting the duo should expect to MEASURE these two
# values, exactly as thor-muse's refused 0.40 -> 0.55 taught (docs/machine-profiles.md).
gpu_mem_util = 0.30
max_model_len = 131072
# compressed-tensors (mixed precision: fp8 attn/lm_head + nvfp4 MLP), NOT the
# outgoing checkpoint's modelopt — using modelopt here fails on a quant-method
# mismatch.
quantization = "compressed-tensors"
kv_cache_dtype = "fp8"
max_num_seqs = 2

[roles.senses]
feasible = true
model = "coolthor/gemma-4-12B-it-NVFP4A16"
gpu_mem_util = 0.14
max_model_len = 32768
quantization = "compressed-tensors"
attention_backend = "TRITON_ATTN"

[roles.embedder]
feasible = true
model = "Qwen/Qwen3-Embedding-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192

[roles.reranker]
feasible = true
model = "Qwen/Qwen3-Reranker-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192
