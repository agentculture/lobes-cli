# Jetson AGX Thor (Blackwell-class sm_110, 128 GB unified memory) — the
# validated-on-this-box profile. The baseline below (models, gpu_mem_util,
# max_model_len, quantization) is IDENTICAL to spark.toml on purpose: Thor is
# also a 128 GB unified-memory Blackwell-class board, and only 4 knobs were
# found to diverge when this profile was validated live (see
# lobes/machines/thor.py + lobes/machines/_traits.py:SM_110).
#
# Those 4 divergent knobs are deliberately ABSENT here (cortex.kv_cache_dtype,
# embedder.attention_backend, reranker.attention_backend,
# reranker.enforce_eager): lobes/profiles/loader.py overlays them from the
# live lobes.machines chip-strategy registry rather than re-typing the
# literal values in this file, so the SM_110 trait / thor CardStrategy stays
# the single source of truth for WHY each one holds (see each Knob's
# provenance string there). Editing the trait or the thor strategy changes
# what this profile resolves to with no edit needed here.
name = "thor"
summary = "Jetson AGX Thor (Blackwell-class sm_110, 128 GB unified) — load-tested divergences from spark"

[roles.cortex]
feasible = true
# unsloth/Qwen3.8-27B-NVFP4 — tracks the fleet default primary (spark.toml,
# since 2026-08-19). The MODEL is deliberately NOT a per-card divergence:
# thor's cortex must differ from spark's in kv_cache_dtype ALONE (see
# tests/test_profile_schema.py::test_thor_builtin_encodes_exactly_the_four_validated_divergences),
# so pinning a different checkpoint here would silently break that contract.
# (This line lagged at Qwen3.6-27B until 2026-08-20 — a silent drift the
# deviation-d1 render surfaced when a Thor box actually hosted cortex again.)
#
# STATUS on sm_110: VALIDATED live 2026-08-20 (deviation d1) on the physical
# Thor via the spark-lobe shape at the FULL 1M YaRN window — weights 22.47
# GiB, KV pool 1,114,504 tokens (1.06x at 1M), 12.1 tok/s single-stream,
# known-answer + structured tool_calls PASS
# (docs/evidence/2026-08-20-accept-cortex-local-thor.txt) — with ONE
# sm_110-only caveat the schema deliberately cannot encode (it lives in the
# compose lane, like the worker MoE-backend note): MTP MUST BE OFF. The
# 8bd082 nightly ships no sm_110 image for fused_gdn_decode_post_conv_mtp
# (the Qwen 27B line is GDN-hybrid); the non-MTP GDN decode path works. A
# Thor deployment removes the primary lane's --speculative-config line until
# a PRIMARY_SPECULATIVE_CONFIG knob ships or a nightly restores the kernel.
model = "unsloth/Qwen3.8-27B-NVFP4"
# Budget INHERITED, not measured for this checkpoint — identical caveat to
# spark.toml's duo values. 0.30 / 131072 were measured for the outgoing
# TEXT-ONLY export; this one adds an unquantized bf16 ViT. A machine-as-brain
# Thor should expect to MEASURE these (docs/machine-profiles.md). Note Thor
# does not host cortex at all in its current shape (thor-worker drops it).
gpu_mem_util = 0.30
max_model_len = 131072
# compressed-tensors, matching the checkpoint's own quant_method (the outgoing
# export used modelopt; passing that here fails on a quant-method mismatch).
quantization = "compressed-tensors"
max_num_seqs = 2
# kv_cache_dtype: overlaid from lobes.machines.get("thor") — measured "auto"
# (the fp8 default asserts k_scale > 0.0 on this checkpoint/board pairing).

[roles.senses]
feasible = true
model = "coolthor/gemma-4-12B-it-NVFP4A16"
gpu_mem_util = 0.14
max_model_len = 32768
quantization = "compressed-tensors"
attention_backend = "TRITON_ATTN"

[roles.hand]
# The `hand` lobe (LiquidAI LFM2.5-1.2B-Instruct) — the fleet's fine-tuning
# base, default-hosted on every card. ~2.4 GiB of bf16 weights, text-only, no
# ViT, no thinking mode; served with --enable-lora ARMED and (in v1) an EMPTY
# adapter inventory. See docs/lfm2.5-1.2b-hand.md.
#
# quantization is DELIBERATELY ABSENT from this block, on every card: the
# catalog's quantization="none" bf16 sentinel means the lane must omit
# --quantization ENTIRELY. Declaring it here — even as an empty string — would
# render a flag that corrupts bf16 weights.
#
# BUDGET: DECLARED, NOT MEASURED (#108). Same 128 GB unified-memory board as the
# Spark, so the same ~7.7 GiB at 0.06 and the same caveat: this card's measured
# co-residency history (thor-muse's refused 0.40 -> measured 0.55) is exactly
# why an unmeasured number stays labelled as one. Total 0.56 -> 0.62.
feasible = true
model = "LiquidAI/LFM2.5-1.2B-Instruct"
gpu_mem_util = 0.06
max_model_len = 32768

[roles.embedder]
feasible = true
model = "Qwen/Qwen3-Embedding-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192
# attention_backend: overlaid from the shared SM_110 trait — TRITON_ATTN
# (the FlashInfer/FLASH_ATTN pooling path hangs on sm_110).

[roles.reranker]
feasible = true
model = "Qwen/Qwen3-Reranker-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192
# attention_backend + enforce_eager: overlaid from the shared SM_110 trait —
# TRITON_ATTN + enforce_eager=true (CUDA-graph capture is unstable here).
