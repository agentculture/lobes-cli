# Jetson AGX Thor (Blackwell-class sm_110, 128 GB unified memory) — the
# validated-on-this-box profile. The baseline below (models, gpu_mem_util,
# max_model_len, quantization) is IDENTICAL to spark.toml on purpose: Thor is
# also a 128 GB unified-memory Blackwell-class board, and only 4 knobs were
# found to diverge when this profile was validated live (see
# lobes/machines/thor.py + lobes/machines/_traits.py:SM_110).
#
# Those 4 divergent knobs are deliberately ABSENT here (cortex.kv_cache_dtype,
# embedder.attention_backend, reranker.attention_backend,
# reranker.enforce_eager): lobes/profiles/loader.py overlays them from the
# live lobes.machines chip-strategy registry rather than re-typing the
# literal values in this file, so the SM_110 trait / thor CardStrategy stays
# the single source of truth for WHY each one holds (see each Knob's
# provenance string there). Editing the trait or the thor strategy changes
# what this profile resolves to with no edit needed here.
name = "thor"
summary = "Jetson AGX Thor (Blackwell-class sm_110, 128 GB unified) — load-tested divergences from spark"

[roles.cortex]
feasible = true
# unsloth/Qwen3.8-27B-NVFP4 — tracks the fleet default primary (spark.toml,
# since 2026-08-19). The MODEL is deliberately NOT a per-card divergence:
# thor's cortex must differ from spark's in kv_cache_dtype ALONE (see
# tests/test_profile_schema.py::test_thor_builtin_encodes_exactly_the_four_validated_divergences),
# so pinning a different checkpoint here would silently break that contract.
# (This line lagged at Qwen3.6-27B until 2026-08-20 — a silent drift the
# deviation-d1 render surfaced when a Thor box actually hosted cortex again.)
#
# STATUS on sm_110: VALIDATED live 2026-08-20 (deviation d1) on the physical
# Thor via the spark-lobe shape at the FULL 1M YaRN window — weights 22.47
# GiB, KV pool 1,114,504 tokens (1.06x at 1M), 12.1 tok/s single-stream,
# known-answer + structured tool_calls PASS
# (docs/evidence/2026-08-20-accept-cortex-local-thor.txt) — with ONE
# sm_110-only caveat the schema deliberately cannot encode (it lives in the
# compose lane, like the worker MoE-backend note).
#
# That caveat used to read "MTP MUST BE OFF". It is now MEASURED to be
# narrower than that, 2026-08-25
# (docs/evidence/2026-08-25-spike-thor-cortex-speculation.txt):
#
#   MTP must be off ONLY ON THE CUDA GDN DECODE PATH. The 8bd082 nightly
#   ships no sm_110 image for fused_gdn_decode_post_conv_mtp (the Qwen 27B
#   line is GDN-hybrid, not dense), and vLLM's own capability probe CANNOT
#   detect that — it tests hasattr(torch.ops._C, ...) and
#   has_device_capability(80), and on sm_110 the symbol IS built and the
#   capability IS >= 8.0; only the SASS image is absent. So it launches and
#   dies on the FIRST DECODE rather than falling back.
#
#   Setting VLLM_GDN_DECODE_KERNEL=triton routes around it. That env var is
#   a REQUIRED conjunct of the fused-MTP gate in
#   qwen_gdn_linear_attn.py:_can_use_fused_gdn_mtp_decode, so forcing the
#   Triton path means the missing kernel is never launched. MEASURED on this
#   board: the Triton path costs essentially NOTHING on the unspeculated
#   floor (12.19-12.21 vs 12.1-12.2 tok/s on CUDA), and MTP-n2 then serves
#   at 26.8 tok/s on code — +120%.
#
# Two traps recorded so they are not re-derived: swapping DRAFTER does not
# dodge the gap (the gate keys off the target's verification batch,
# num_spec_decodes > 0, not off which drafter produced the tokens), and MTP
# is not the riskier arm (both the MTP head and the DSpark drafter are
# layer_type="full_attention"; neither touches GDN).
#
# NOT resolved on this board: DSpark. It loads and its KV fits (630,029
# tokens, 2.40x at 262144) but warmup dies with a CUDA illegal memory access
# in the DRAFT ATTENTION path, and the hypothesis that FlashInfer-on-sm_110
# is the cause cannot be tested because the generate lanes expose no
# attention-backend knob (issue #206). Separately, MTP changes greedy output
# on this GDN-hybrid lane (issue #207) — speed is measured, token-for-token
# equivalence with no-speculation is REFUTED here.
model = "unsloth/Qwen3.8-27B-NVFP4"
# Budget INHERITED, not measured for this checkpoint — identical caveat to
# spark.toml's duo values. 0.30 / 131072 were measured for the outgoing
# TEXT-ONLY export; this one adds an unquantized bf16 ViT. A machine-as-brain
# Thor should expect to MEASURE these (docs/machine-profiles.md). Note Thor
# does not host cortex at all in its current shape (thor-worker drops it).
gpu_mem_util = 0.30
max_model_len = 131072
# compressed-tensors, matching the checkpoint's own quant_method (the outgoing
# export used modelopt; passing that here fails on a quant-method mismatch).
quantization = "compressed-tensors"
max_num_seqs = 2
# kv_cache_dtype: overlaid from lobes.machines.get("thor") — measured "auto"
# (the fp8 default asserts k_scale > 0.0 on this checkpoint/board pairing).

[roles.senses]
feasible = true
model = "coolthor/gemma-4-12B-it-NVFP4A16"
gpu_mem_util = 0.14
max_model_len = 32768
quantization = "compressed-tensors"
attention_backend = "TRITON_ATTN"

[roles.hand]
# INFEASIBLE on this card — MEASURED, not declared (2026-08-20, the fifth
# validated sm_110 divergence). LFM2.5-1.2B BOOTS healthy here (including
# LoRA init — retiring #181's original boot-time attribution) but INFERENCE
# is broken: corrupted deterministic generations escalating to CUDA
# unspecified-launch-failure / EngineCore death within 1-3 requests, on BOTH
# the 8bd082 nightly and the prior 0.23.1 production engine, while the
# IDENTICAL config passes cleanly on the Spark GB10 the same day. A lane
# that serves wrong answers is worse than an honest 404, so this card
# declares hand off; a deployment reaches it via the (since-2026-08-20)
# HAND_PEER_ORIGIN/_PROXY channels instead. Evidence:
# docs/evidence/2026-08-20-hand-thor-blocked-reattributed.txt. Re-measure on
# engine upgrades — this is a kernel-coverage fact, not silicon fate.
#
# The model/budget lines are DELIBERATELY ABSENT: an infeasible role renders
# no lane on this card (the catalog names what the role WOULD serve).
feasible = false

[roles.embedder]
feasible = true
model = "Qwen/Qwen3-Embedding-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192
# attention_backend: overlaid from the shared SM_110 trait — TRITON_ATTN
# (the FlashInfer/FLASH_ATTN pooling path hangs on sm_110).

[roles.reranker]
feasible = true
model = "Qwen/Qwen3-Reranker-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192
# attention_backend + enforce_eager: overlaid from the shared SM_110 trait —
# TRITON_ATTN + enforce_eager=true (CUDA-graph capture is unstable here).
