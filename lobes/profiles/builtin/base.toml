# The conservative fallback profile for an UNRECOGNISED card (t14). Resolved
# by `lobes init` when `lobes.runtime._detect.detect_card()` returns UNKNOWN
# and no `--profile` was given — the alternative to refusing outright.
#
# The bet this profile makes: an unrecognised box gets a SMALL generate model
# plus the two 0.6B pooling gears, never the 27B `cortex` primary
# (sakamakismile/Qwen3.6-27B-Text-NVFP4-MTP) — that checkpoint's util 0.30 /
# 128K footprint is only load-tested on the DGX Spark (GB10) and Jetson AGX
# Thor (both 128 GB unified-memory, Blackwell-class boards); serving it
# unconditionally on an unknown card risks an OOM crash-loop on first boot.
# `senses` (the 12B multimodal gear) is marked infeasible for the same
# reason — see lobes/profiles/render.py's <PREFIX>_FEASIBLE=false marker,
# honoured end-to-end by the gateway/capabilities surface (t6).
#
# `cortex` here is rendered onto the fleet template's PRIMARY_* env vars
# (see lobes/profiles/render.py:ROLE_ENV_PREFIX) using the same small
# "minor" gear lobes/catalog.py already knows (role_hint="minor",
# Qwen/Qwen3.5-4B, bf16/unquantized, 256K native — see catalog.py and
# docs/qwen3.5-4b-minor.md) at a modest context/util so a first boot on
# unknown hardware has the best chance of fitting in memory. This profile
# takes no position on `quantization`/`enforce_eager`/`max_num_seqs` for
# cortex (left absent -> the compose template's own ${VAR:-default}
# applies, same convention as spark.toml/thor.toml for every knob they
# don't diverge on).
#
# This is NOT the broader "small default on every card" change (issue #107)
# — recognised cards (spark, thor, or a future one added the same way) are
# completely unaffected: they still resolve their own profile and never see
# this file at all.
name = "base"
summary = "Unrecognised card — conservative fallback: small generate model + pooling gears, no 27B"

[roles.cortex]
feasible = true
model = "Qwen/Qwen3.5-4B"
gpu_mem_util = 0.30
max_model_len = 32768

[roles.senses]
feasible = false

# The opt-in 31B `muse` lobe is likewise vetoed on an unrecognised card — a
# 30.4 GiB-weight model on unknown hardware risks the same OOM crash-loop as
# the 27B cortex. A muse-hosting shape (thor-muse) rendered against THIS card
# stays muse-less; write a custom card profile to override.
[roles.muse]
feasible = false

# The opt-in 35B-A3B `worker` lobe (the fast ground-work doer) is vetoed on an
# unrecognised card for the same reason as muse — an MoE this size on unknown
# hardware risks an OOM crash-loop. A worker-hosting shape (thor-worker)
# rendered against THIS card stays worker-less; write a custom card profile to
# override.
[roles.worker]
feasible = false

# The opt-in Nemotron 3.5 Lightning `associate` lobe (the doer that does NOT
# act — lightning-on-orin plan t6) is vetoed on an unrecognised card for the
# same reason as muse and worker: ~17.9 GiB of NVFP4 weights plus a KV pool on
# unknown hardware risks an OOM crash-loop, and this profile's whole premise is
# that a first boot on an unknown card must not OOM. An associate-hosting shape
# rendered against THIS card stays associate-less; write a custom card profile
# to override.
[roles.associate]
feasible = false

[roles.hand]
# The `hand` lobe (LiquidAI LFM2.5-1.2B-Instruct) — the fleet's fine-tuning
# base, default-hosted on every card. ~2.4 GiB of bf16 weights, text-only, no
# ViT, no thinking mode; served with --enable-lora ARMED and (in v1) an EMPTY
# adapter inventory. See docs/lfm2.5-1.2b-hand.md.
#
# quantization is DELIBERATELY ABSENT from this block, on every card: the
# catalog's quantization="none" bf16 sentinel means the lane must omit
# --quantization ENTIRELY. Declaring it here — even as an empty string — would
# render a flag that corrupts bf16 weights.
#
# BUDGET: conservative, matching this profile's whole premise — an unrecognised
# card must not OOM on first boot. 0.06 at a 32K window on ~2.4 GiB of weights
# is the smallest generate lane lobes can serve, which is precisely why `hand`
# is FEASIBLE here while senses/muse/worker are vetoed: it is the one generate
# role whose footprint is safe to assume on unknown hardware.
feasible = true
model = "LiquidAI/LFM2.5-1.2B-Instruct"
gpu_mem_util = 0.06
max_model_len = 32768

[roles.embedder]
feasible = true
model = "Qwen/Qwen3-Embedding-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192

[roles.reranker]
feasible = true
model = "Qwen/Qwen3-Reranker-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192
