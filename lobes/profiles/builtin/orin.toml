# Jetson AGX Orin 64GB Developer Kit (Ampere sm_87, 61.3 GiB unified memory) —
# the fleet profile for the one card in this mesh that is NOT Blackwell-class.
#
# Card DETECTION lives in lobes/machines/orin.py (hostname / device-tree marker
# "orin", sm_87, 64 GB); this file is the fleet-shaped half — which roles the
# board can serve at all, and with which knobs. It supersedes the hand-authored
# operator profile docs/orin-profiles.md records at
# <deploy-dir>/profiles/orin.toml (an operator file of the same name still wins
# over this built-in, per lobes/profiles/loader.py).
#
# What this board serves: `cortex` — but through the **llama.cpp** lane, on a
# GGUF checkpoint, NOT the NVFP4 primary (see the engine section below) — plus
# `senses` (the Gemma 4 12B multimodal gear), the `hand` fine-tuning base, and
# the two ~0.6B pooling gears. The two remaining NVFP4 generate lobes, `muse`
# and `worker`, are feasible=false; see the shared rationale below.
#
# !!! cortex and senses CANNOT CO-RESIDE on this board !!!  MEASURED
# 2026-08-23: the llama.cpp cortex holds ~33 GiB resident at its served window
# and `senses` holds 0.45 x 61.3 = ~27.6 GiB, against 61.3 GiB of unified memory
# with ZERO swap configured. Feasibility (can this board serve the role at all?)
# and co-residency (which roles fit together?) are different axes here, and only
# the first is a card fact — so BOTH roles are declared feasible below and the
# DEPLOYMENT SHAPE is what picks one: `orin-cortex` (hosts cortex, drops senses)
# or `orin-lobe` (hosts senses, drops cortex).
#
# That used to be a WARNING in this banner and nothing more, which left the
# DEFAULT path broken: `machine-as-brain` hosts every role a card declares
# feasible, so a bare `lobes init --apply` on this board rendered a deployment
# that starts both and is expected to OOM. It is now a DECLARATION the tool
# acts on — the `[[exclusive_roles]]` table below, read by `lobes init`'s
# co-residency guard (lobes/profiles/shape_render.py's `overcommitted_groups`).
# A bare `lobes init` on this card REFUSES, naming `orin-cortex` / `orin-lobe`;
# an explicitly typed `--shape machine-as-brain` warns and proceeds, matching
# --profile's own "forcing a profile onto a card it was not validated for
# (warns, but proceeds)" precedent. Nothing about the RENDER changed: the
# declaration writes no .env key and no compose file, and every other card,
# declaring no group at all, is untouched.
#
# Two knobs are deliberately ABSENT from the pooling roles at the bottom
# (embedder.attention_backend, reranker.attention_backend +
# reranker.enforce_eager): lobes/profiles/loader.py overlays them from the live
# lobes.machines chip-strategy registry rather than re-typing the literals here,
# so the orin CardStrategy stays the single source of truth for WHY each one
# holds (each Knob there carries its own provenance string). Same mechanism
# thor.toml uses for its four sm_110 divergences.
#
# A knob left out of a role table means the profile takes no position on it
# (the compose template's own ${VAR:-default} applies) — same convention as
# spark.toml / thor.toml; see RoleProfile in lobes/profiles/schema.py.
name = "orin"
summary = "Jetson AGX Orin 64GB (Ampere sm_87, 64 GB unified) — senses + pooling gears; the NVFP4 lobes need Blackwell"

# --- csv-mode GPU access -----------------------------------------------------
#
# MEASURED LIVE on this box (docs/orin-profiles.md divergence 1): the NVIDIA
# container toolkit here is 1.19.1 with `mode = "auto"` in
# /etc/nvidia-container-runtime/config.toml, and auto RESOLVES TO THE LEGACY CSV
# MODE on this Jetson. In csv mode the compose templates'
# `deploy.resources.reservations.devices` GPU request fails at container CREATE:
#
#   "invoking the NVIDIA Container Runtime Hook directly ... is not supported.
#    Please use the NVIDIA Container Runtime"
#
# csv mode wants the container told to use the `nvidia` runtime instead. Docker
# Compose has no conditional-block syntax, so no ${VAR} substitution in the
# shipped template can express both forms — declaring it here makes `lobes init`
# GENERATE the compose overrides (docker-compose.gpu.yml +
# docker-compose.gpu-audio.yml) that `!reset` the deploy stanza and set
# `runtime: nvidia`, on EVERY render.
#
# That "every render" is the whole point. The deployed box has been running the
# equivalent as a HAND EDIT of the scaffolded compose files since 2026-07-16 —
# and a re-init silently reverts it, which is exactly what the next live boot is
# about to do. Same posture as the LOBES_IOWAIT_DEGRADED_THRESHOLD host_env
# declaration below: state the board fact in-tree rather than leave it in a shell
# history.
#
# Scope + honesty: this is a fact about THIS board's toolkit installation, not
# about sm_87 in general. A Jetson on JetPack 7 (CDI mode — Thor's presumed
# situation, since the Thor fleet boots with the stock deploy stanza) should
# leave this at the default "devices"; an operator profile of the same name
# overrides this built-in wholesale (lobes/profiles/loader.py), which is the
# escape hatch. The generated overrides are UNVALIDATED until a live boot on this
# board consumes them (#108) — `docker compose config` renders them correctly,
# which proves the compose merge, not the container create.
gpu_access = "runtime"

# --- co-residency: the pair this board cannot host together ------------------
#
# The machine-readable half of the banner above. `roles` is the group itself;
# `shapes` names the deployment shapes that resolve it, so the refusal points at
# a concrete alternative instead of a bare "pass --shape" (deriving that from
# the built-in shape set would offer `spark-lobe`/`thor-lobe` too — shapes that
# "resolve" a cortex/senses clash on the wrong board); `reason` is the measured
# arithmetic, quoted back verbatim so the operator can check it. Both named
# shapes are proven to exist and to actually resolve the group by
# tests/test_init_coresidency.py, so this cannot drift into a lie.
[[exclusive_roles]]
roles = ["cortex", "senses"]
shapes = ["orin-cortex", "orin-lobe"]
reason = "MEASURED 2026-08-23: cortex (llama.cpp GGUF Q4_K_M at 262144) holds ~33 GiB resident and senses holds 0.45 x 61.3 = ~27.6 GiB, against 61.3 GiB of unified memory with ZERO swap"

# --- the NVFP4 architecture line, and the engine that steps around it --------
#
# TWO of the NVFP4 exports this fleet serves — cortex
# (unsloth/Qwen3.8-27B-NVFP4) and muse (nvidia/Gemma-4-31B-IT-NVFP4) — quantize
# ACTIVATIONS to FP4 (W4A4 on the MLP path). FP4 activations are executed by
# BLACKWELL FP4 tensor cores; sm_87 is Ampere, one generation short. No
# gpu_mem_util makes that work — it is a feasibility fact, NOT a memory
# tradeoff (docs/orin-profiles.md "Why no cortex"; the same statement heads
# lobes/machines/orin.py). That line STANDS, unweakened, for those two.
#
# --- the Lightning carve-out: W4A4 is NOT why worker is false here ----------
#
# The third NVFP4 lobe — worker
# (nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4) — used to be named in
# the sentence above. That was FALSE for this checkpoint, and the checkpoint's
# OWN hf_quant_config.json (fetched 2026-08-25) is what disproves it:
#   * quant_algo = "MIXED_PRECISION" — not a uniform-NVFP4 export at all;
#   * every routed AND shared expert up_proj/down_proj is "W4A16_NVFP4",
#     group_size 16 — WEIGHT-only FP4 weights, 16-bit activations;
#   * the mixer in_proj/out_proj are "FP8";
#   * kv_cache_quant_algo is "FP8".
# W4A16 is structurally the SAME exception this board already runs for `senses`
# (int4 W4A16, weight-only, dequantized through Marlin into 16-bit arithmetic).
# There is no FP4 activation path here to be one generation short of.
#
# CONFIRMED LIVE 2026-08-25 on this physical board
# (docs/evidence/2026-08-25-spike-lightning-vllm-orin.txt): vLLM v0.27.1
# accepted quantization=modelopt_mixed on sm_87 and selected a full Marlin
# fallback stack — MarlinFP8ScaledMMLinearKernel, MarlinNvFp4LinearKernel and
# the 'MARLIN' NvFp4 MoE backend — plus native FlashAttention 2, serving
# correct output at ~78-81 tok/s. The FP8 halves of the config ARE a real
# sm_87 barrier: the FP8 KV cache was worked around with
# --kv-cache-dtype bfloat16, and the FP8 in_proj/out_proj went through the
# Marlin FP8 kernel rather than native FP8 tensor cores.
#
# `worker` nevertheless stays feasible = false below, UNCHANGED — this block
# corrects the stated REASON only. Hosting Lightning on this board is a
# separate decision with its own budget knobs and shape (plan
# lightning-on-orin, tasks t6/t8/t9), not a side effect of a comment fix.
#
# That line is about the CHECKPOINT FORMAT, not about the ROLE — which is what
# the `cortex` block below now turns on. Two other things on this board already
# step around the same barrier the same way:
#   * `senses` is weight-only int4 (W4A16): its weights dequantize through
#     vLLM's Marlin/int4 path (compute capability >= 8.0) and its activations
#     stay 16-bit;
#   * `hand` is plain bf16 and never quantized at all.
# A GGUF Q4_K_M is the third: weight-only, dequantized per block into 16-bit
# arithmetic, with no FP4 activation path anywhere in it.
#
# `muse` stays feasible=false for the W4A4 reason above, and `worker` stays
# feasible=false because no gear is DECLARED for it here yet — neither because
# the roles are impossible.
# feasible=false renders <PREFIX>_FEASIBLE=false and nothing else — no model, no
# knobs (lobes/profiles/render.py) — so a dropped lobe is never half-served; a
# box on this profile reaches them by honest referral / proxy instead.
[roles.cortex]
# *** MEASURED LIVE on this box, 2026-08-23 (plan qwen3-8-gguf-llamacpp task t1
# *** spike): docs/evidence/2026-08-23-spike-qwen38-gguf-llamacpp-orin.txt.
# *** NOTHING here is VALIDATED — the acceptance transcript is that plan's t10,
# *** and until it lands no doc, support table or `lobes capabilities` output
# *** may claim this lane validated (#108). The spike's own verdict was
# *** "functional GO / throughput FAIL-AS-SPECIFIED": correct decode, full
# *** context, tool calling and reasoning_content all PASS, and 2.61 tok/s
# *** single-stream decode, which is BELOW the plan's >= 5 tok/s gate.
#
# The catalog's FIRST non-vLLM gear (lobes/catalog.py's `engine` axis,
# ENGINE_LLAMA_CPP). Declaring it here is what makes `lobes init` render the
# `llamacpp-primary` compose lane instead of `vllm-primary`: the engine is read
# off the catalog entry for THIS model id, never off a separate knob that could
# drift from it (lobes/profiles/shape_render.py's role_service / role_engine).
# The composed render carries COMPOSE_PROFILES=llamacpp plus
# PRIMARY_URL=http://llamacpp-primary:8000, and the generated
# docker-compose.shape.yml parks `vllm-primary` — so the caller-facing alias
# (model=cortex|main|hard) is unchanged and only the lane behind it moved.
#
# It is the SAME upstream checkpoint the Blackwell boxes serve as cortex
# (unsloth/Qwen3.8-27B-NVFP4), in a different container format for a different
# engine — so this board joins the mesh's cortex hosts rather than approximating
# one. Read off the downloaded file (sha256-verified in the transcript):
#   general.architecture "qwen35" · 27.32B params · 15.33 GiB on disk · Q4_K_M
#   n_ctx_train 262144 · block_count 65, full_attention_interval 4
#   head_count 24 / head_count_kv 4 · key_length = value_length = 256
#
# NO gpu_mem_util, NO quantization, NO kv_cache_dtype, NO attention_backend, and
# those absences are the point rather than an oversight — `llama-server` has
# none of those flags. Its quantization lives INSIDE the .gguf; its memory
# follows -ngl (all 65 layers offloaded) and -c (the window below), so there is
# no utilization fraction to declare; and it takes --jinja plus the model's own
# embedded chat template rather than a reasoning/tool parser pair. A knob
# declared here that reaches no flag is exactly the dead declaration #92 exists
# to prevent.
#
# BUDGET, MEASURED at this exact window on this box (not computed, not scaled
# from another card): weights 15.33 GiB + KV 16.00 GiB = **~33 GiB resident**
# (the pre-boot prediction from the GGUF header was 31.33 GiB; runtime overhead
# accounts for the ~1.7 GiB difference). KV costs 64 KiB/token because only 16
# of the 65 layers hold a per-token KV cache — the other 49 are Mamba/SSM with
# constant state — and those 16 use GQA at head_count_kv=4, k=v=256, f16. The
# spike ran with `senses` STOPPED: free RAM went 23 -> 47 GiB on stopping it,
# cortex took ~33, and ~13 GiB stayed free. Load time 84 s cold / 15.6 s warm.
#
# max_model_len is the GGUF's OWN declared native ceiling, served in full and
# needle-probed at the spike; it is the `-c` flag on this lane, not vLLM's
# --max-model-len. Trim it to shrink the footprint — 64 KiB/token is the
# exchange rate, and it is the only memory dial this engine has.
feasible = true
model = "unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M"
max_model_len = 262144

[roles.muse]
feasible = false

[roles.worker]
feasible = false

[roles.senses]
feasible = true
# unsloth/gemma-4-12B-it-qat-w4a16 — QAT (quantization-aware trained) int4
# W4A16, compressed-tensors "pack-quantized". Read off the checkpoint's OWN
# config.json (fetched 2026-08-04; the same facts are cited in lobes/catalog.py
# and docs/gemma-4-12b-qat-w4a16.md), never off the model card:
#   - architectures ["Gemma4UnifiedForConditionalGeneration"], model_type
#     "gemma4_unified" — the SAME class the incumbent coolthor gear serves, so
#     this repo's existing Dockerfile.vllm-gemma4 image already handles it;
#   - text_config.max_position_embeddings = 262144 (see max_model_len below);
#   - quantization_config: num_bits=4, type=int, strategy=group, group_size=32
#     — INT4, not FP4 (that is what makes sm_87 plausible at all);
#   - vision_config AND audio_config both present (audio_token_id 258881,
#     video_token_id 258884). Audio is DECLARED, not proven: #101 found vLLM's
#     gemma4_unified path silently DROPS input_audio on the coolthor gear, and
#     that is a path gap, not a per-checkpoint one — probing it is a later task.
# The checkpoint carries NO draft head of its own; the senses lane's MTP draft
# is an env-level flag (MULTIMODAL_SPECULATIVE_CONFIG, with an off sentinel),
# not a Profile knob — RoleProfile has exactly nine fields and none of them is
# speculative_config.
model = "unsloth/gemma-4-12B-it-qat-w4a16"
# *** BOTH VALUES BELOW ARE MEASURED — live boot on a physical Jetson AGX Orin
# *** 64GB (sm_87), 2026-08-04. Transcript:
# *** docs/evidence/2026-08-04-accept-senses-unsloth-orin.txt
#
# The 0.45 / 262144 hypothesis BOOTED FIRST TRY at the full native window — no
# trim, nothing refused (unlike thor-muse's 0.40, which was refused and became
# 0.55). Measured, senses booted FIRST into an empty device:
#
#   model weights loaded          9.07 GiB   (incumbent coolthor: 9.25 GiB)
#   Available KV cache memory    11.81 GiB
#   GPU KV cache size           609,266 tokens
#   max concurrency @ 262,144     2.32x      (a KV-pool CEILING, not throughput)
#   init engine                   284.92 s   (compilation 120.05 s)
#
# BOOT ORDER STILL MATTERS — do not copy these numbers to a gears-first boot.
# gpu_memory_utilization is a fraction of the ENTIRE device, so every byte a
# co-resident engine already holds is deducted one-for-one from KV (KV is the
# only elastic term). Measured on this same box the same day (approved deviation
# d1, issue #171): the incumbent booted AFTER the pooling gears held 11.29 GiB /
# 480,431 tokens, against the 18.86 GiB / 802,644 that docs/orin-profiles.md
# records for a senses-FIRST boot of the same checkpoint at the same knobs.
# Boot senses first.
#
# WHERE THE NON-KV MEMORY GOES, and why it is worth it: 0.45 x 61.3 GiB = 27.59
# GiB of budget, minus 9.07 GiB of weights, leaves ~18.5 GiB — yet KV got 11.81.
# The ~6.7 GiB difference is peak activation, which vLLM profiles here with
# "1 video items of the maximum feature size" (boot log). That is the price of
# the ViT actually working: this checkpoint PASSES the reversed-motion video
# control that the incumbent FAILS. KV per token is also 17% cheaper than the
# incumbent's (20.3 KiB vs 24.6 KiB), so the smaller pool still holds 609,266
# tokens at DOUBLE the context window.
#
# One knob left on the table: CUDA-graph capture is under-accounted because
# VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0, and vLLM's own log suggests
# compensating by raising util 0.4500 -> 0.4551. Untested here.
#
# NOTE: this checkpoint's config.json ships WITHOUT vision_config.num_soft_tokens,
# which crash-loops the served vLLM build (AttributeError in
# multimodal/encoder_budget.py). The boot above required patching that one field
# back in (280, the value its sibling coolthor export declares; every other
# vision_config key is byte-identical). See the evidence transcript and #177.
gpu_mem_util = 0.45
max_model_len = 262144
# compressed-tensors, matching the checkpoint's own quant_method. vLLM reads the
# exact scheme (int4 pack-quantized here, nvfp4-pack-quantized on the coolthor
# incumbent) off the checkpoint itself, so the FLAG is the same for both and the
# KERNEL PATH is not — the int4 path is the unproven half on sm_87.
quantization = "compressed-tensors"
# TRITON_ATTN: every role that booted on this box (senses/embedder/reranker,
# 2026-07-16/17) used it; FlashInfer is unvalidated here (docs/orin-profiles.md).
attention_backend = "TRITON_ATTN"

[roles.hand]
# The `hand` lobe (LiquidAI LFM2.5-1.2B-Instruct) — the fleet's fine-tuning
# base, default-hosted on every card. ~2.4 GiB of bf16 weights, text-only, no
# ViT, no thinking mode; served with --enable-lora ARMED and (in v1) an EMPTY
# adapter inventory. See docs/lfm2.5-1.2b-hand.md.
#
# quantization is DELIBERATELY ABSENT from this block, on every card: the
# catalog's quantization="none" bf16 sentinel means the lane must omit
# --quantization ENTIRELY. Declaring it here — even as an empty string — would
# render a flag that corrupts bf16 weights.
#
# BUDGET: DECLARED. One live observation, NOT a reproducible measurement — see
# docs/evidence/2026-08-10-hand-lobe-budget-derivation.txt. This value was
# DECLARED at 0.10 and the box refuted it TWICE, which is exactly why t10
# exists:
#
#   * at 0.10 the boot died before profiling — "Free memory on device cuda:0
#     (4.67/61.34 GiB) on startup is less than desired GPU memory utilization
#     (0.1, 6.13 GiB)". The orin-lobe shape's committed lanes plus the box's
#     other workload simply do not leave 6.13 GiB.
#   * at 0.06 it booted ONCE and profiled healthy (available KV 2.7 GiB, pool
#     235,721 tokens, 7.19x at the served 32768 window) — and then FAILED TWICE
#     at the identical util, profiling 0.14 GiB and 0.09 GiB. One success, two
#     refusals.
#
# So 0.10 was too big to fit, and 0.06 is not reliably big enough. This box is
# SHARED (senses at 0.45, the pooling gears, unrelated production containers)
# and vLLM clamps its budget against actual free memory at startup, which moved
# by ~2.7 GiB across the three runs. A util leaving ~1 GiB of margin on a 61 GiB
# card sits inside that noise.
#
# 0.06 is kept as the best available single data point, explicitly DECLARED.
# An operator whose Orin refuses it should raise this value until the boot log
# reports comfortable KV, or trim max_model_len (vLLM names the length that
# would fit — 7984 in the tightest run). Tracked as issue #183.
#
# The per-card util mechanism (see schema.py) is retained and currently carries
# no divergence: every card declares 0.06.
feasible = true
model = "LiquidAI/LFM2.5-1.2B-Instruct"
gpu_mem_util = 0.06
max_model_len = 32768
# TRITON_ATTN: the conservative sm_87 carry-over every role that booted on this
# box uses. FlashInfer is unvalidated here (docs/orin-profiles.md).
attention_backend = "TRITON_ATTN"

[roles.embedder]
feasible = true
model = "Qwen/Qwen3-Embedding-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192
# attention_backend: overlaid from lobes.machines.get("orin") — TRITON_ATTN, a
# conservative first-boot carry-over of Thor's sm_110 pooling divergence that
# was NOT independently re-tested on sm_87. This gear booted healthy that way
# (1024-dim embeddings, 2026-07-17).

[roles.reranker]
feasible = true
model = "Qwen/Qwen3-Reranker-0.6B"
gpu_mem_util = 0.06
max_model_len = 8192
# attention_backend + enforce_eager: overlaid from lobes.machines.get("orin") —
# TRITON_ATTN + enforce_eager=true, the same carried-over Jetson safe-boot
# choice. This gear booted healthy that way and its ordering probe passed
# (relevant document top-ranked, score 0.82 — 2026-07-17).

# --- card-level (non-role) .env: the Tegra iowait accounting quirk -----------
#
# !!! DO NOT "FIX" THIS BACK TO 50 — 50 MAKES THIS BOARD SHED EVERYTHING !!!
#
# MEASURED LIVE on this box (2026-07-17, re-confirmed 2026-08-04): /proc/stat
# reports ~59% iowait — 5 of 8 cores at ~97% — with ZERO disk I/O (vmstat
# bi/bo ≈ 0), GPU 0%, and every core idling at its minimum clock. The cause is
# Tegra ACCOUNTING, not load: the cpufreq-governor kthreads `sugov:0` /
# `sugov:4` flicker through D (uninterruptible) state, and the kernel counts a
# core idling while any task is in D state as iowait — so nr_iowait is inflated
# on a board doing no I/O at all.
#
# The gateway's pressure policy reads that number literally
# (lobes/gateway/_pressure_policy.py: iowait% > LOBES_IOWAIT_DEGRADED_THRESHOLD
# → busy) and, at the shipped default of 50, permanently 429-sheds EVERY
# full-tier request — on this card that is all of `senses`, the only generate
# lobe the board can serve. Not a degradation: a total, indefinite outage of
# the box's one lobe, on an idle machine.
#
# 100 is "effectively disabled" (iowait% can never exceed 100), which is the
# remedy env.example already documents for the DGX Spark GB10's own phantom
# /proc/pressure/io reading (dgx-spark-cli#22) — the same knob, the same
# posture, a different cause. It is also EXACTLY the value the deployed box has
# been running since 2026-07-17, as an ephemeral shell-env override on the
# gateway container that any `docker compose up` silently reverts; declaring it
# here is what makes the live state survive a re-render. LOBES_SWAP_DEGRADED_-
# THRESHOLD is deliberately left alone (75, the shipped default): swap is
# measured honestly on this board and remains the real memory-pressure guard.
#
# Scope: this is a CARD fact (the board's own /proc/stat accounting), so it
# lives on the card profile and every deployment shape rendered over `orin`
# inherits it — machine-as-brain included. It is NOT on the orin-lobe shape:
# a shape-scoped fix would leave a bare `lobes init` on this same board
# shedding, which is the default path.
#
# A repo-level fix — PSI-based or disk-I/O-corroborated pressure sampling that
# does not trust nr_iowait on Tegra — would retire this line. Until then it is
# the honest declaration, not a workaround hidden in a shell history.
[host_env]
LOBES_IOWAIT_DEGRADED_THRESHOLD = "100"
